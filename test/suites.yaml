# test/suites.yaml: every test suite, one entry each. `dt list` prints it; `dt plan` expands it.
# Format and rules: docs/internals/rfcs/rfc-29-test-harness.md. A suite runs beside others under
# dt run --parallel only with parallel: true, set once checked: docs/internals/testing-parallel.md.
version: 1

defaults:            # any suite field; a suite's own value wins
  format: exit       # how results are read
  tier: merge        # the smallest tier that runs the suite: pr < merge < nightly; manual never auto
  timeout: { test: 30m, cell: 60m }   # each test, and the whole cell

groups:              # `dt run GROUP` runs every suite in it
  lint: [lint-go, lint-repo, shellcheck]
  go: [unit, integration, e2e, operator]
  conformance: [pjdfstest, pynfs, wpts, smbtorture]
  perf: [fio-verify, bench-smoke, perf-night]
  journal: [journal-conformance]
  engine: [engine-conformance, engine-soak]
  adapters: [adapter-conformance]

suites:
  # Lint. `job` keeps the check names the develop ruleset requires. Every command of a list
  # runs even after one fails, so a red job reports every check that failed.
  lint-go:
    job: Go Checks
    parallel: true
    tier: pr
    cmd:
      - go mod verify                         # the module cache still matches go.sum
      - { sh: 'test -z "$(gofmt -s -l .)" || { gofmt -s -l .; exit 1; }' }
      - go vet ./...
      # Tagged tests compile in no other check, so one could stop compiling without anything
      # going red. None of these tags excludes another.
      - go vet -tags=e2e,integration,ad_dc,portmap_system,stress,journal_conformance,journal_plant_split,journal_plant_truncate,journal_model,journal_soak,journal_bench,engine_conformance,engine_soak,engine_bench,adapter_conformance ./...
      # The adapters run on every platform a node does, and their socket code differs by
      # platform, so they are vetted for Windows and macOS beside the host's own.
      - { sh: 'for os in windows darwin; do GOOS=$os go vet ./pkg/adapter/... ./pkg/resources/... ./internal/adapter/... || exit 1; done' }
      - go run ./test/spec-citations          # the MS-FSCC, MS-FSA and MS-SMB2 citations
      # The tests that pin an authorization or encryption gate, run by name: the edit that
      # reopens a gate can delete its test in the same change.
      - test/required-tests.sh
      - golangci-lint run --timeout=5m
  lint-repo:
    job: Repo Checks
    parallel: true
    tier: pr
    cmd:
      - test/harness/bin/dt docs --check       # the guide's suite table and command reference match the registry and dt
      - test/harness/bin/dt doctor             # fails on an expired quarantine entry, here alone
      - test/common/known-failures_test.sh
      - test/nfs-mount/nfstest/parse-results_test.sh   # the grader the knfsd baseline keeps
      - test/new-package-tests.sh {base}       # a new package carries a test of its own
      # A docs: commit changes only documentation, and no commit credits an AI tool. Both run
      # on pushes too, since planning commits reach develop without a pull request.
      - test/commit-type-matches-diff.sh {base}
      - test/no-ai-attribution.sh {base}
      - test/go-cache-push-only.sh             # only a push run saves to the Actions cache
      - go test ./test/harness/...              # dt's own tests
      - go test ./test/journal/                 # every journal RFC row maps to a test or an owner
  # Every shell script: the *.sh files, and the executables without an extension whose first
  # line is a shell's shebang.
  shellcheck:
    job: ShellCheck
    parallel: true
    tier: pr
    cmd:
      sh: |
        git -c core.quotePath=false ls-files -s | while read -r mode _ _ f; do
          [ -f "$f" ] || continue
          case "${f##*/}" in
            *.sh) ;;
            *.*) continue ;;
            *) [ "$mode" = 100755 ] && head -n1 "$f" | grep -Eq '^#! */[^ ]*/(env *)?[abk]*sh' || continue ;;
          esac
          printf '%s\0' "$f"
        done | xargs -0 shellcheck --severity=warning
  unit:
    job: Unit Tests (1.26.x)
    parallel: true
    format: go-json
    # Its coverage profile goes beside the cell's results, for the coverage report.
    cmd: go test -race {args} -timeout=25m -coverprofile={out}/coverage.txt {packages}
    packages: { patterns: [./pkg/..., ./internal/..., ./cmd/..., ./test/...] }   # dt run --changed narrows them
    args: { pr: "-short" }
    tier: pr
    options:
      windows:
        cmd: go test -short -race -p 2 -timeout=25m ./...
        needs: [windows]
        blocking: { pr: false }
      nonrace:
        # Not the aggregate random-write gate: with no baseline it passes whatever it measures.
        cmd: "go test -timeout=25m -run=^(TestBLAKE3FasterThanSHA256|TestSealChunk_AllocBounded)$ ./pkg/block/ ./pkg/block/middleware/compression/"
        # decision: blocking at nightly, the one tier it runs in, so a gate that trips again on the
        # retry turns the run red and posts to the develop-status issue. The throughput gate
        # measures on a shared runner, where a busy neighbour can trip it; it fails no pull request.
        tier: nightly
      # The journal's allocation and memory checks — the index's, the data path's, durability's
      # and the record codec's — and the profiler's heap checks, which skip under -race.
      journal-index:
        cmd:
          - go test -timeout=5m ./pkg/block/journal/internal/index/ ./pkg/block/journal/internal/durability/ ./pkg/block/journal/internal/format/ ./internal/prof/
          - go test -timeout=5m -run=^(TestReadOfALargeRecordAllocatesFlat|TestRFC1D_StatsCostIsFlat)$ ./pkg/block/journal/internal/datapath/
      # The index built with a bug planted in its split and the truncate marker with one planted
      # past its size, which the model fuzz and the model's runs must find. The planted builds
      # break the packages' other tests by design, so only these tests run.
      journal-plant:
        cmd:
          - go test -tags=journal_plant_split -timeout=2m -run=^TestFuzzFindsPlantedSplit$ ./pkg/block/journal/internal/index/
          - go test -tags=journal_plant_split,journal_conformance -timeout=10m -run=^TestModelDataPathFindsPlantedSupersession$ ./pkg/block/journal/conformance/
          - go test -tags=journal_plant_truncate,journal_conformance,journal_model -timeout=10m -run=^TestModelManySeedsFindsPlantedTruncate$ ./pkg/block/journal/conformance/
      # The journal's allocation checks, which the race detector makes unmeasurable and the race
      # leg of journal-conformance skips as known: the counted calls of RFC 1 §9.7, running
      # without -race, where allocation counting works, with the flat-Stats check, whose rig
      # builds 10^5 extents under the profiler's heap check, which it passed once the fixture
      # stopped keeping the closed journal's core reachable at that check, and the same cost
      # check over the figures a reopened journal serves.
      journal-conformance-norace:
        cmd: go test -timeout=5m -tags=journal_conformance -run=^(TestCounted_AllocationsPerCall|TestRFC1D_StatsCostIsFlat|TestStatsAfterOpenWalksNoLock) ./pkg/block/journal/conformance/
        tier: pr
      # The adapters' allocation gates, which skip under -race.
      adapter-allocs:
        cmd: go test -timeout=5m ./internal/adapter/adaptertest/testproto/ ./internal/adapter/core/ ./internal/adapter/nfs/protocol/ ./pkg/resources/ ./internal/adapter/nfs/wire/ ./internal/adapter/smb/protocol/ ./internal/adapter/smb/wire/
      # The architecture rules and the CLI reference check read the whole module, so a change
      # anywhere can break them, and the OpenAPI document check reads openapi.json, a file that
      # is no Go package's; with no {packages}, dt run --changed never narrows them away.
      whole-tree:
        cmd: go test -race -timeout=5m -run=^(TestImportRules|TestNodeExports|TestReferenceMatchesCommandTrees|TestImports|TestOpenAPIMatchesRouteTable)$ ./internal/node/ ./internal/node/api/ ./cmd/gendocs/ ./pkg/identity/
  # The journal's conformance checks, behind their own tag: they fail until the journal they
  # check is written, and each failure is a known one, so the unit suite would turn red on them.
  journal-conformance:
    format: go-json
    cmd: go test -race -tags=journal_conformance -timeout=30m -artifacts -outputdir={out} ./pkg/block/journal/conformance/...
    known: test/journal/known.yaml
    tier: pr
  # The reference model over many seeds, each seed a fresh random timeline of the same
  # operations: the change runs its handful of seeds, and the rare timeline only many of
  # them see is nightly, not per-change, with DITTOFS_MODEL_SEEDS holding the count. No
  # -race: the seeds multiply the run's cost, and journal-conformance already races a change.
  # decision: no known: file — the model red on one seed is a divergence to fix, and an
  # entry would mute every later seed's telling of it. A flake goes to quarantine, with
  # an issue and an expiry date, never to a known list.
  journal-model:
    format: go-json
    cmd: go test -tags=journal_conformance,journal_model -run ^TestModelManySeeds$ -timeout=110m -artifacts -outputdir={out} ./pkg/block/journal/conformance/
    env:
      DITTOFS_MODEL_SEEDS: "100"
      # The base turns over every night: the day's count of days times the seed count
      # gives each night its own block of seeds, one no other night's block overlaps,
      # while a rerun the same night draws the same ones
      # and a failure's line names the number its rerun needs. The registry's
      # own {out}/{base} substitution reaches no run date, so the value is this
      # spelled word the test itself resolves - the smallest change until a
      # date-valued key lands in the harness.
      DITTOFS_MODEL_SEED_BASE: "night"
    tier: nightly
    # The cell limit sits above the seeded run: the registry's default 60m cell would kill
    # it mid-seed, red for the wrong reason.
    timeout: { test: 110m, cell: 120m }
  # The hours-long soak: counters, descriptors and the footprint held flat for
  # DITTOFS_SOAK_DURATION, a stability no short checked run can show. No -race, as for the
  # model: the detector changes the timing a soak explores.
  # decision: no known: file — drift in a counter the soak checks is a leak to fix, not a
  # figure to list. A flake goes to quarantine, with an issue and an expiry date, never
  # to a known list.
  journal-soak:
    format: go-json
    cmd: go test -tags=journal_conformance,journal_soak -run ^TestJournalSoak -timeout=150m -artifacts -outputdir={out} ./pkg/block/journal/conformance/
    env:
      DITTOFS_SOAK_DURATION: "2h"
    tier: nightly
    # Mandatory, and above the soak's own 2h run: the registry's default cell timeout (60m)
    # would kill the soak with its drift unmeasured; the test limit stops a hung one.
    timeout: { test: 150m, cell: 160m }
  # RFC 1's J1 to J3, the journal's write path, scaling and point lookups, written to
  # {out}/bench.txt for benchstat. Interpretable only beside the raw figures of the same
  # device, so run by hand with DITTOFS_BENCH_DIR on it, gating nothing, as engine-bench:
  # JOURNAL_BENCH_COUNT=1 in the environment takes one count. The pattern takes the raw
  # twins (BenchmarkRaw*) with the J rows, since a J row is read only as a fraction of its
  # twin. A directory on a RAM-backed filesystem fails the benchmark on its own check, so
  # that refusal exits 1 (b.Fatalf in the rows), deliberately unlike the unset-variable
  # guard's 2. No -race: it changes the latency they measure. No -timeout either: go test applies none to benchmarks, so the
  # cell's limit is the guard — engine-bench's, the same headroom, not the registry's
  # default 60m, which a real run's counts could outlive.
  # decision: format exit, not go-json: go test -json sends no pass event for a passing
  # benchmark, which a go-json cell grades as failed.
  # decision: manual until a daily run exists, the ledger row the journal plan carries. The
  # reference box is the dedicated host, and a figure compares only against that host's own;
  # the daily run waits for a window on it, or a provisioned runner, as the ledger row says.
  # decision: no known: file — a benchmark that refuses to run is a finding to fix; its
  # b.Fatalf line is in bench.txt. A flake goes to quarantine, with an issue and an
  # expiry date, never to a known list.
  journal-bench:
    cmd:
      # The bench pattern's quotes rule out the flow style shellcheck's and engine-bench's
      # single-quoted lines use, so the entry takes the literal block the shellcheck one does.
      - sh: |
          test -n "$DITTOFS_BENCH_DIR" || { echo "set DITTOFS_BENCH_DIR to a directory on the device under test" >&2; exit 2; }; n=10; test -z "$JOURNAL_BENCH_COUNT" || n=$JOURNAL_BENCH_COUNT; case $n in [!1-9]*|*[!0-9]*) echo "JOURNAL_BENCH_COUNT must be a number of 1 or more, without a leading zero" >&2; exit 2;; esac; go test -count=$n -benchtime=1x -tags=journal_conformance,journal_bench -run ^$ -bench '^Benchmark(J[123]_|Raw)' ./pkg/block/journal/conformance/ > {out}/bench.txt; s=$?; cat {out}/bench.txt; test $s -ne 0 || grep -q '^BenchmarkJ' {out}/bench.txt || { echo "no BenchmarkJ benchmark ran" >&2; exit 2; }; exit $s
    tier: manual
    timeout: { test: 300m, cell: 310m }
  # The engine's conformance checks, behind their own tag for the same reason: they run
  # against the real journal and fail until the engine and the journal calls they need land.
  engine-conformance:
    format: go-json
    cmd: go test -race -tags=engine_conformance -timeout=30m ./pkg/block/engine/conformance/... ./internal/vfs/integration/...
    known: test/engine/known.yaml
    tier: pr
  # The crash-and-restart soak over the composed engine, a short fixed list of seeds. Its run
  # over the real journal is red until the journal can sync and recover. No -race: the race
  # detector changes the timing a soak explores. engine-conformance covers the engine's races, and
  # unit runs the soak's fault log, which carries no tag, under -race.
  engine-soak:
    format: go-json
    cmd: go test -tags=engine_conformance,engine_soak -run=^(TestSoak|TestOracle) -timeout=20m ./internal/vfs/integration/...
    known: test/engine/soak-known.yaml
    tier: pr
  # The engine's benchmarks, RFC 8 §15.4's B5, B7 and B9, over a composition on a real directory
  # with an on-disk store and the real clock; run by hand on the dedicated host, gating nothing.
  # Each iteration is one run of a workload, so -benchtime=1x -count=10 gives benchstat its
  # samples, written to {out}/bench.txt; ENGINE_BENCH_COUNT=1 in the environment takes one.
  # DITTOFS_BENCH_DIR must name a directory on the device under test: without it every
  # benchmark skips and go test passes, so the cell fails before running it.
  # No -race: it changes the latency they measure, and engine-conformance covers the races.
  # No -timeout either: go test applies none to benchmarks, so the cell's limit is the guard.
  # decision: format exit, not go-json: go test -json sends no pass event for a passing
  # benchmark, which a go-json cell grades as failed. A count a benchmark breaks fails the cell,
  # which then names the command rather than the benchmark; its b.Fatalf line is in bench.txt.
  engine-bench:
    cmd:
      - { sh: 'test -n "$DITTOFS_BENCH_DIR" || { echo "set DITTOFS_BENCH_DIR to a directory on the device under test" >&2; exit 2; }; n=10; test -z "$ENGINE_BENCH_COUNT" || n=$ENGINE_BENCH_COUNT; case $n in [!1-9]*|*[!0-9]*) echo "ENGINE_BENCH_COUNT must be a number of 1 or more, without a leading zero" >&2; exit 2;; esac; go test -count=$n -benchtime=1x -tags=engine_conformance,engine_bench -run ^$ -bench . ./internal/vfs/integration/ > {out}/bench.txt; s=$?; cat {out}/bench.txt; exit $s' }
    tier: manual
    timeout: { test: 300m, cell: 310m }
  # The reconcile pass a live change waits on, at 10⁴ shares cold and under share churn, against
  # RFC 23 §8's 5 s; run by hand, gating nothing. -count=10 gives benchstat its samples, written
  # to {out}/bench.txt. A figure over the bound is a finding, not a failure: the cell fails only
  # when a pass leaves a change unbound. No -race, as for engine-bench. Badger and the journal live
  # under t.TempDir(), so TMPDIR is pointed at DITTOFS_BENCH_DIR, a directory on the device under
  # test: on tmpfs the fsyncs a bind waits on vanish and the figures are not comparable. A cold
  # pass at 10⁴ shares allocates about 22 GB, so run it on a host that holds that.
  reconcile-bench:
    cmd:
      - { sh: 'test -n "$DITTOFS_BENCH_DIR" || { echo "set DITTOFS_BENCH_DIR to a directory on the device under test" >&2; exit 2; }; TMPDIR=$DITTOFS_BENCH_DIR go test -count=10 -benchtime=1x -run ^$ -bench ^BenchmarkReconcile$ ./internal/node/ > {out}/bench.txt; s=$?; cat {out}/bench.txt; exit $s' }
    tier: manual
    timeout: { test: 180m, cell: 190m }
  # Measures only the version-limit probe, with journal setup outside the timer.
  version-limit-probe-bench:
    cmd:
      - { sh: 'go test -count=10 -run ^$ -bench ^BenchmarkVersionLimitProbe$ ./pkg/block/engine > {out}/bench.txt; s=$?; cat {out}/bench.txt; exit $s' }
    tier: manual
  # The commit rate of eight concurrent Seal and PutSecret writers with the settings generation's
  # raise and without it, to read RFC 13's plan §4.3 trigger (the raise under half the baseline's
  # rate). Compare with benchstat -col /mode on bench.txt. No -race and the default -benchtime, as a
  # rate needs a timed run of many commits. Badger lives under t.TempDir(), so TMPDIR is pointed at
  # DITTOFS_BENCH_DIR, a directory on the device under test: on tmpfs the fsync a commit waits on
  # vanishes and the rates are not comparable.
  settings-gen-bench:
    cmd:
      - { sh: 'test -n "$DITTOFS_BENCH_DIR" || { echo "set DITTOFS_BENCH_DIR to a directory on the device under test" >&2; exit 2; }; TMPDIR=$DITTOFS_BENCH_DIR go test -count=10 -run ^$ -bench ^BenchmarkSettingsGenerationCost$ ./pkg/secrets/ > {out}/bench.txt; s=$?; cat {out}/bench.txt; exit $s' }
    tier: manual
  # The adapters' specifications that wait on a stub, behind their own tag: each fails until the
  # epic that fills its stub, and each failure is a known one.
  adapter-conformance:
    format: go-json
    cmd: go test -race -tags=adapter_conformance -run ^TestConformance ./internal/adapter/...
    known: test/adapter/known.yaml
    tier: pr
  integration:
    job: Integration Tests (1.26.x)
    format: go-json
    cmd: go test -tags=integration -p 1 -timeout=20m {packages}
    packages: { tag: integration }
    tier: pr
    needs: [docker, "service:postgres", "service:kmip"]
    options:
      portmap:  { cmd: go test -tags=portmap_system -timeout=2m ./test/integration/portmap/..., needs: [linux, rpcbind] }
      kerberos: { cmd: go test -tags=kerberos -timeout=5m ./test/integration/kerberos/, needs: [docker] }
      # decision: blocking after a merge and nightly, the tiers it runs in, so a failure that
      # survives the retry turns develop red and posts to the develop-status issue. The flake that
      # failed about one develop run in seven went when the fixture started the domain once.
      ad-dc:    { cmd: go test -tags=ad_dc -timeout=20m ./test/integration/ad-dc/, needs: [linux, docker, smbclient], tier: merge }
  operator:
    dir: k8s/dittofs-operator
    cmd:
      - make test
      - make lint
      - make manifests-verify
      - kubectl kustomize config/default
    tier: pr
  e2e:
    format: go-json
    cmd: go test -tags=e2e -timeout=30m ./test/e2e/...
    env:
      DITTOFS_E2E_REQUIRE_NLM: "1"
      DITTOFS_E2E_REQUIRE_KERBEROS: "1"
      # decision: no DITTOFS_E2E_NIGHTLY yet. The two dedup tests it turns on fail in their
      # setup, so it comes back, under nightly, with their fix or their known-failure entries.
    needs: [linux, root, nfs-client, smb-client, nfs4-acl-tools, "service:localstack"]
    # decision: non-blocking on pull requests only, so a failure from outside the code, such as a
    # change to the machine it runs on, can't hold every merge while it's fixed; after a merge and
    # nightly it blocks, so a red e2e makes develop red and posts. Drop this after a week with no
    # e2e failure on develop.
    blocking: { pr: false }
    options:
      stress: { cmd: "go test -tags=e2e,stress -run ^TestStress -timeout=30m ./test/e2e/", tier: nightly }
      kerberos:                         # the Kerberos mounts, on pull requests that can affect them
        cmd: go test -tags=e2e -run Kerberos -timeout=30m ./test/e2e/
        tier: pr
        paths:
          - internal/adapter/**
          - pkg/adapter/**
          - pkg/metadata/**
          - internal/auth/**
          - internal/identity/**            # the identity server: sign-in and resolution
          - pkg/identity/**                 # identity's contract
          - pkg/auth/**
          - pkg/bootstrap/**                # the Kerberos keytab and principal
          - cmd/dfs/**                      # the server's Kerberos capability at start
          - test/e2e/framework/kerberos.go
          - test/integration/kerberos/**
      # The tests that reach one file through both protocols, on pull requests that can break
      # them: a drift between NFS and SMB is invisible to every single-protocol suite. The
      # Kerberos one runs in kerberos above.
      # decision: no system scenarios beside them yet. They are the scenarios of the slices that
      # move the adapters onto the VFS service, and none has landed.
      cross-protocol:
        cmd: go test -tags=e2e -run CrossProtocol -skip Kerberos -timeout=30m ./test/e2e/
        tier: pr
        # Selection is by test name, so a cross-protocol test named for what it
        # checks rather than the protocol pair needs its file here or a name it
        # matches: only tests the -run pattern hits run.
        paths:
          - internal/adapter/**
          - pkg/adapter/**
          - internal/vfs/**
          - pkg/vfs/**
          - pkg/metadata/**
          - pkg/auth/**                       # the SIDs both adapters encode
          - pkg/identity/**                   # the caller and identity types both adapters carry
          - test/e2e/framework/**             # the mount and fixture code the option runs on

  # Conformance runs the production profile, badger-s3, only.
  pjdfstest:
    format: tap
    cmd: prove -v {test}
    dir: "{mount}"
    tests: "{tools}/pjdfstest/tests/*/*.t"
    matrix: { profile: [badger-s3], nfs: ["3", "4", "4.1"] }
    fixture:
      profile: "{profile}"
      nfs: { version: "{nfs}", options: "noac,sync,lookupcache=none" }
      squash: none                      # root keeps its privileges, as pjdfstest needs
      users: [65532, 65533, 65534]
      delegations: false
    known: test/posix/known.yaml
    tier: pr
    needs: [linux, root, nfs-client]
    parallel: true   # each cell has its own ports, S3 prefix and mount point: three at once checked
  pynfs:
    format: junit
    cmd: "{tools}/pynfs/bin/pynfs-4.{minor} {server}:{nfs-port}/export --minorversion {minor} --security sys --uid 0 --gid 0 --rundeps --maketree --xml {out}/junit.xml {names}"
    names: all                          # what {names} holds when a run names no tests
    matrix: { profile: [badger-s3], minor: ["0", "1"] }
    fixture: { profile: "{profile}", nfs: export, squash: none, lease: 30s, users: [1] }   # uid 1 is pynfs's second client
    known: test/nfs-conformance/pynfs/known.yaml
    tier: pr
    needs: [linux]
    options:
      knfsd:                            # the same tests against the kernel's NFS server, for comparison
        matrix: { minor: ["0", "1"] }
        fixture: { server: knfsd, nfs: export, squash: none, lease: 30s }
        tier: manual
        blocking: false
  wpts:
    format: trx
    image: mcr.microsoft.com/windowsprotocoltestsuites:fileserver-v8
    # Its entrypoint only lists the tests unless DryRun is false, and writes these over the
    # config's own values, so they repeat the fixture's.
    env:
      Usage: RunTestCases
      Filter: TestCategory=BVT
      DryRun: "false"
      SutComputerName: "{server}"
      SutIPAddress: "{server}"
      # A value without a dot keeps WPTS in workgroup mode, as the fixture has no domain
      # controller. The server's address won't do: WPTS reads it as a domain's name once
      # its last byte has two digits.
      DomainName: localhost
      AdminUserName: "{user}"
      PasswordForAllUsers: "{password}"
    matrix: { profile: [badger-s3] }
    fixture:
      profile: "{profile}"
      smb: { encryption: preferred, port: 445 }
      shares: test/smb-conformance/shares.yaml
    templates: test/smb-conformance/ptfconfig/*.template
    volumes: { "{out}/config": /data/fileserver }
    known: test/smb-conformance/known.yaml
    tier: pr
    needs: [linux, docker]
  smbtorture:
    format: subunit
    image: quay.io/samba.org/samba-toolbox:v0.8
    # smbtorture's second connections, to IPC$, fail unless its NetBIOS name resolves, as
    # localhost does. smb2.maxfid opens handles until the server refuses one, 65520 by
    # default, which no limit fits: 2000 is far past any real client, so a pass means 2000
    # handles work, not that the server's ceiling was found. smb2.ea.acl_xattr writes the
    # xattr name the server keeps for its ACLs. A space splits arguments, so the options'
    # names have none: smbtorture ignores them in a name.
    cmd: >-
      smbtorture //{server}/{share} -p {smb-port} -U{user}%{password}
      --option=netbiosname=localhost --option=clientminprotocol=SMB2_02
      --option=clientmaxprotocol=SMB3 --option=torture:smbd=false
      --option=torture:maxopenfiles=2000 --option=torture:acl_xattr_name=security.NTACL {test}
    tests: test/smb-conformance/smbtorture/tests.txt
    # One limit for every line of the list: it stops a hang, it doesn't grade speed. The
    # slowest suite took 193 s, and one suite 22 s on one profile and 112 s on another.
    timeout: { test: 5m }
    matrix: { profile: [badger-s3] }
    # smb2.multichannel.bugs.bug_15346 opens its extra connections to 445, whatever -p says.
    fixture: { profile: "{profile}", smb: { port: 445 }, shares: test/smb-conformance/shares.yaml, reset: each }
    known: test/smb-conformance/smbtorture/known.yaml
    tier: pr
    # Over two runners: in one cell it takes about 20 minutes, the pr tier's whole budget.
    # decision: in every tier, since shards isn't set per tier.
    shards: 2
    needs: [linux, docker]
    options:
      # The suite's options, with Kerberos required. smbtorture finds the KDC in the fixture's
      # krb5.conf, and asks it for a ticket to cifs/{server}, a name here. Its tests are session
      # setup, and read and lock, where a truncated or garbled session key shows too.
      # smb2.create isn't one: known-kerberos.yaml doesn't list its known failures.
      kerberos:
        cmd: >-
          smbtorture //{server}/{share} -p {smb-port} -U{user}@{realm}%{password} --use-kerberos=required
          --option=netbiosname=localhost --option=clientminprotocol=SMB2_02
          --option=clientmaxprotocol=SMB3 --option=torture:smbd=false
          --option=torture:maxopenfiles=2000 --option=torture:acl_xattr_name=security.NTACL {test}
        volumes: { "{krb5-conf}": /etc/krb5.conf }
        tests: [smb2.session, smb2.read, smb2.lock]
        timeout: { test: 20m }
        matrix: {}
        fixture: { profile: badger-s3, smb: true, shares: test/smb-conformance/shares.yaml, kerberos: true }
        known: test/smb-conformance/smbtorture/known-kerberos.yaml
        tier: merge
        shards: 1                       # its three tests in one cell

  # What a kernel client sees through an untuned mount, one change at a time: the named
  # mount-option sets. Both run as the user dt runs as, on a client in a network namespace
  # of its own, so an NFSv3 lock reaches the server's lock manager through the host's rpcbind.
  cthon04:
    tests: test/nfs-mount/cthon04/tests.txt   # each program on its own, with its command line
    cmd: "{test-args}"
    dir: "{tools}/cthon04"
    matrix:
      profile: [badger-s3]
      mount-options:
        - default: ""                   # none: the kernel negotiates NFSv4.2 against DittoFS
        - v3: vers=3,tcp,mountproto=tcp
        - v4.0: vers=4.0
        - v4.1: vers=4.1
        - v4.1-noac: vers=4.1,noac
        - v4.1-smallio: vers=4.1,rsize=32768,wsize=32768
    fixture:
      profile: "{profile}"
      nfs: { options: "{mount-options}" }    # mounted at {mount}, at the version vers= gives
      shares: test/nfs-mount/shares.yaml
      users: [self]
      client: namespace
      rpcbind: host
    known: test/nfs-mount/cthon04/known.yaml
    timeout: { test: 1m }   # each takes 15 s or less, but lock/tlocklfs, which has its own
    tier: pr
    needs: [linux]
  nfstest:
    format: nfstest
    tests: test/nfs-mount/nfstest/tests.txt   # the modules, each with the sets it runs on
    # nfstest mounts by itself, at the version it's told, so a set gives its flags.
    cmd: "{tools}/nfstest/bin/nfstest_{test} --server {server} --port {nfs-port} --export /export --nfsversion {nfs} --mtpoint /tmp/dittofs-test --mtopts {mtopts} --rmtraces --notty {test-args}"
    matrix:
      profile: [badger-s3]
      mount-options:
        - default: { nfs: "4.2", mtopts: hard }
        - v3: { nfs: "3", mtopts: "hard,tcp,mountproto=tcp" }
        - v4.0: { nfs: "4.0", mtopts: hard }
        - v4.1: { nfs: "4.1", mtopts: hard }
        - v4.1-noac: { nfs: "4.1", mtopts: "hard,noac" }
        - v4.1-smallio: { nfs: "4.1", mtopts: "hard,rsize=32768,wsize=32768" }
    fixture: { profile: "{profile}", nfs: export, shares: test/nfs-mount/shares.yaml, users: [self], client: namespace, clients: 2, rpcbind: host }
    known: test/nfs-mount/nfstest/known.yaml
    timeout: { test: 20m }
    tier: nightly
    needs: [linux]

  # Each platform's own client mounts the fixture's share over SMB, and the workloads run over the
  # mount. The suite itself runs on linux, and also sees its blocks reach the bucket.
  clients:
    tests: [test/clients/files.sh, test/clients/rename.sh, test/clients/s3.sh]
    cmd: "{test} {mount} {bucket}"   # s3.sh reads the bucket's listing; the others take the mount alone
    fixture: { profile: badger-s3, smb: { mount: true } }
    needs: [linux, root, smb-client]
    # decision: Linux runs after each merge, as the SMB client workflow this replaces ran on SMB
    # changes, and on feat/storage-v2 too, which has no nightly; macOS and Windows, on scarcer
    # runners, run nightly on develop only.
    tier: merge
    # decision: macOS and Windows stay on memory, since badger-s3 needs Localstack, a Linux
    # container, and their hosted runners run none: macOS's have no Docker, Windows's run Windows
    # containers only. Move them to badger-s3 once an S3 endpoint runs there.
    options:
      # decision: SMB 2.1, the newest dialect of Windows 7 and Server 2008 R2, keeps a real client:
      # the Linux one asked for it, against the server as it ships. Nightly, as WPTS already checks
      # its negotiation on every pull request.
      smb21:
        fixture: { profile: badger-s3, smb: { mount: true, dialect: "2.1" } }
        tier: nightly
      macos:
        tests: [test/clients/files.sh, test/clients/xattr.sh]
        cmd: "{test} {mount}"
        env: { SMB_URL: "//{user}:{password}@{server}:{smb-port}/{share}" }   # xattr.sh mounts the share again
        needs: [macos]
        fixture: { profile: memory, smb: { mount: true } }
        tier: nightly
      windows:
        tests: [test/clients/files.ps1]
        cmd: powershell -NoProfile -ExecutionPolicy Bypass -File {test} {mount}
        needs: [windows]
        fixture: { profile: memory, smb: { mount: true } }
        tier: nightly

  # The nightly performance run on the dedicated host: DittoFS against Samba over SMB, scored
  # against the night's 7-day medians (bench/ditto). It posts to the scenarios' Slack channel by
  # their rules; dt keeps its exit status, its summary and slack.txt.
  # decision: before system, so the dedicated host's nightly runs it first, on a quiet host, and
  # the long scenarios after it.
  perf-night:
    cmd: bench/ditto/night.sh
    env: { DT_OUT: "{out}", SLACK_DIR: /etc/dittofs-perf, SCENARIO_HOST: ditto, STOP_AFTER: "10500" }
    tier: nightly
    needs: [linux, root, host:dedicated]
    # A night of one repeat takes about 1 h 30 min, its build and lock wait included. STOP_AFTER
    # cuts it to end 5 minutes before the limit, so it still cleans up and posts.
    timeout: { test: 3h }
  # journal-bench's bodies at the small sizes (DITTOFS_BENCH_SCALE=small: blocks of 4 to 64 KiB,
  # bursts of a few MiB), three counts of one iteration, nightly on the dedicated host: dt's
  # go-bench reader puts each night's medians in the run's results.json for dt history, and
  # {out} keeps each group's bench.txt-shaped file (for benchstat), its cpu, mutex, block and
  # heap profiles, and meta.txt (toolchain, filesystem and mount options, the device's raw
  # fsync probe). One test per group because the reader reads per named test; test/journal/
  # bench-data.sh runs it. DITTOFS_BENCH_DIR defaults to ~/dittofs-bench, on the host's own
  # disk. needs host:dedicated, not a shared runner, whose busy neighbours' noise the
  # throughput gate admits: one fixed box makes the absolute figures mean something, beside
  # perf-night's medians. It follows perf-night in this file, which is the order the host's
  # night runs them in, so perf-night keeps its quiet host and these few minutes come after it.
  # The host's own `dt run --tier nightly --place dedicated` runs it, as it runs perf-night:
  # tests.yml's plan select names neither, and a hosted job could never be placed on that host.
  # decision: the figures are collected, never checked: a regression is a finding, and a
  # check would need a ruling that names a counted bound (RFC 1 §9.7 stays intact: no timing
  # is judged in CI). blocking: false, so a b.Fatalf fails the cell, never the nightly, and
  # posts nothing to the develop-status issue.
  # decision: the host runs develop's latest commit, so the stream starts when storage-v2
  # reaches develop; empty until then is the design, not a bug.
  # decision: the host's results directory keeps these figures as long as its own cleanup
  # does, and no GitHub artifact holds them (GitHub's 90-day default doesn't apply); revisit
  # with the first trend longer than that is wanted, by offloading older runs, not before.
  # decision: format exit, as journal-bench's: go test sends no pass event for a passing
  # benchmark, which a go-json cell grades as failed.
  journal-bench-data:
    cmd: test/journal/bench-data.sh {test} {out}
    tests: [j1, j2, j3]
    format: exit
    metrics: go-bench
    tier: nightly
    blocking: false
    needs: [linux, host:dedicated]
    timeout: { test: 30m, cell: 100m }
  # The system scenarios: a real server in a container, real clients, faults injected.
  # setup.sh takes a scenario by its file name, in its own directory. A run through dt is reported
  # by dt, and never posts to the scenarios' Slack channel.
  system:
    cmd: { sh: 'test/scenarios/setup.sh "$(basename {test})"' }
    tests: test/scenarios/[0-9][0-9]-*.sh
    select: { merge: "[0-8]?-*.sh" }
    env: { SLACK_DIR: /nonexistent }
    known: test/scenarios/known.yaml
    # decision: on the dedicated host alone, which sets the `system (dedicated)` status on the
    # develop commits it runs. Should it be down for long, dropping host:dedicated and putting back
    # `shards: 4` and `blocking: false` runs the scenarios on hosted runners again, where apt
    # mirrors stalled setup.sh for minutes.
    needs: [linux, podman, host:dedicated]
    needs_by_test:
      "9?-*.sh": ["disk:110"]
    timeout: { test: size, cell: 90m }
  fio-verify:
    # The job files are templates, as dfsbench's are: fio doesn't expand their ${VAR:-default}s, so
    # perl fills them from the environment into a copy below {out}, which fio runs.
    cmd:
      - cp {test} {out}/{test}
      - perl -pi -e s/\$\{(\w+):-([^}]*)\}/$ENV{$1}||$2/ge {out}/{test}
      - fio --output-format=json --output={out}/{test}.json {out}/{test}
    tests: bench/*/*.fio   # dfsbench's workloads, and the verify jobs, which read their data back
    exclude: [bench/workloads/layout.fio]
    fixture: { profile: badger-s3, nfs: "4.1", squash: none }   # fio runs as root, which keeps its privileges
    env: { BENCH_DIR: "{mount}" }
    metrics: fio-json
    tier: nightly
    needs: [linux, root, nfs-client, fio]
    options:
      smb: { fixture: { profile: badger-s3, smb: { mount: true } }, needs: [linux, root, smb-client, fio] }
  # That the benchmarks still work, not how fast: the smoke run benchmarks a temp dir, not DittoFS.
  bench-smoke:
    cmd:
      - go run ./cmd/bench run --smoke --results {out}
      # decision: the mailbox job files are only parsed, not run: dfsbench doesn't run them, so
      # without this nothing would notice one that no longer parses.
      - { sh: 'for job in bench/workloads/mailbox/*.fio; do TARGET_DIR={out} bench/workloads/mailbox/run.sh "$job" --parse-only || exit 1; done' }
    metrics: dfsbench-json
    needs: [fio]
    tier: pr
    # decision: non-blocking on pull requests, which it now runs on whatever they touch, so one that
    # breaks it still merges; after a merge and nightly it blocks, so develop goes red and it posts.
    # Drop the exception after a week with no bench-smoke failure on develop.
    blocking: { pr: false }
