# The engine's conformance tests that fail today, one entry per test, never a pattern, each
# naming the epic expected to turn it green. A test that starts to pass fails the run: remove
# its entry in the change that turned it green, a journal change included. Each entry's
# message is the failure it is known by: a test failing for any other reason is unexpected.
- test: TestRFC8A_StableWriteLazyExistence
  message: 'after the crash: committed size 24, mtime'
  status: fail
  fix: planned
  category: feature
  reason: 'the start''s re-application over the recovered journal: a write synced before its Commit survives the crash whole, its size committed at 24 and its bytes read back; the mtime it read at the write does not — the re-application carries the time of its own replay, not the record''s, so the committed mtime reads the wall clock, want the write''s. The row waits on the start''s replay carrying each record''s staged mtime.'
  issue: '#4210'
- test: TestRFC8C_DeclaredInterfaces
  message: 'the engine never calls 1 declared methods: [Journal.Draw]'
  status: fail
  fix: planned
  category: feature
  reason: 'the engine passing Journal.Draw as a method value (the method value in engine/write.go), which the architecture test counts as no call (uncalled in engine/conformance/arch_test.go): every other declared method is called, and the row reports Journal.Draw alone until the engine calls it directly.'
  issue: '#4206'
- test: TestRFC8A_AttachAfterDeviceLoss
  message: 'fixture: journal init: rename'
  status: fail
  fix: planned
  category: feature
  reason: 'the fixture''s Reinit under the crash seam (Fixture.Reinit in engine/enginetest/fixture.go): a re-initialised journal is refused until RecordJournal, then the share attaches above its old limit. Init and Open work; the fixture attaches the share and the journal reports its version counter, so the row gets past its first write and stops at the fixture''s journal re-initialisation, where the seam''s rename of the format file fails. Whether the seam or the fixture''s removal of the directory under it causes this is not settled.'
  issue: '#4206'
- test: TestRFC8A_RecoveryReappliesInVersionOrder
  message: 'committed size 4096 after the restart, want 12288'
  status: fail
  fix: planned
  category: feature
  reason: 'the start''s re-application over the recovered journal: a write, a truncate and a write past it replay in the journal''s order at start. The open recovers the segments, both writes re-apply and read back, but the truncate between them does not re-apply: the hole it leaves is never punched and the committed size reads 4096, want 12288. The row waits on the start''s replay applying the truncate, removals included, in version order.'
  issue: '#4210'
- test: TestRFC8A_SyncedLossReadsLost
  message: 'committed size 0 and charged 0, want 4096 and 0'
  status: fail
  fix: planned
  category: feature
  reason: 'the open''s loss records reaching the start''s re-application: a synced write the crash corrupted is committed as lost at start, charges nothing and reads ErrLost. The open recovers the segments and finds the loss, but the start''s re-application never commits the file''s existence: the size reads 0, charged 0, and the read answers nil, not ErrLost. The row waits on the open''s loss records landing in the start''s re-application.'
  issue: '#4210'
- test: TestRFC8A_RecoveryUsage
  message: 'usage after recovery {Bytes:0 Files:2}, <nil>, want 8192 bytes'
  status: fail
  fix: planned
  category: feature
  reason: 'the start''s re-application over the recovered journal: the usage after recovery is the bytes re-applied, exactly, and a second restart leaves it unchanged. The open recovers the segments and both files re-apply, but the re-applied bytes are not charged to the share''s usage: it reads 0 bytes, want the 8192 re-applied. The row waits on the re-application charging its bytes to the usage.'
  issue: '#4210'
- test: TestRFC8A_VersionLimitRaise
  message: 'the raise halves need a block of 16'
  status: fail
  fix: planned
  category: feature
  reason: 'a block of 16 the conformance package cannot set (TestRFC8A_VersionLimitRaise): the raise halves of the version limit row, at a block of 16 the conformance package cannot set. Init and Open work; the fixture now attaches the share; the row stops at its own check: the raise halves need a block of 16, which this package cannot set yet. The journal''s Share, Draw and SetVersionLimit are built, so the knob is all the row waits for.'
  issue: '#4206'
- test: TestRFC8_SelfFenceVersionLimitRaise
