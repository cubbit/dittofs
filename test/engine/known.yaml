# The engine's conformance tests that fail today, one entry per test, never a pattern, each
# naming the epic expected to turn it green. A test that starts to pass fails the run: remove
# its entry in the change that turned it green, a journal change included. Each entry's
# message is the failure it is known by: a test failing for any other reason is unexpected.
- test: TestRFC8A_SyncedLossReadsLost
  message: 'committed size 0 and charged 0, want 4096 and 0'
  status: fail
  fix: planned
  category: feature
  reason: 'a synced write the crash corrupted is committed as lost at start, charges nothing and reads ErrLost. The row restarts and finds the file empty: the committed size reads 0 and charged 0, want 4096 and 0, and the read answers nil, not ErrLost. Cause: after the restart the open cuts the corrupted record, the stream''s last synced record with nothing after it to prove it synced, as an unproven tail, and a loss counts only when a recorded mark proves it; the engine keeps no sync marks: its journal open passes nil marks (pkg/block/engine/enginewire/enginewire.go), and JournalOf (pkg/block/engine/journalof.go) drops the marks Sync returns and stubs SyncMarks and MarksRecorded, so no mark proves it. The row waits on the journal keeping a per-stream sync mark that follows every completed sync, then on the engine dropping those stubs and handing the open its recorded marks.'
  issue: '#5261'
- test: TestRFC8A_RetryLaterAtTheShareLimit
  message: 'the share limit has nothing left to free'
  status: fail
  fix: planned
  category: feature
  reason: 'Waits on offload being composed. The settled answer gives retry-later for dirty bytes only with a put-healthy store behind them (RFC 8 section 10.2), and this part composes no store, so the settled no-space in settled() stands, as ruled on #4892; the row assumes a put-healthy store and goes green once offload reads the store put-health for the dirty half. The journal''s repack is real and the ended-unreclaimed figure is served, and the row stops on the settled answer: the share at its limit holds nothing but live bytes, and the refusal''s two repack passes cycle them — each seals its copy target and retires it before the next — leaving not one sealed or ended segment standing, so the answer''s figure reads zero and the refusal ends no space.'
  issue: '#5318'

- test: TestRFC8A_Clone
  message: 'a clone its destination''s journal cannot reserve: engine: the share limit has nothing left to free'
  status: fail
  fix: planned
  category: feature
  reason: 'Waits on offload being composed. The settled answer gives retry-later for dirty bytes only with a put-healthy store behind them (RFC 8 section 10.2), and this part composes no store, so the settled no-space in settled() stands, as ruled on #4892; the row assumes a put-healthy store and goes green once offload reads the store put-health for the dirty half. The same settled answer as its retry-later sibling for the destination''s share: the destination''s journal limit refusal reads an ended-unreclaimed figure of zero once the refusal''s two repack passes have cycled the share''s live bytes, and answers no space where the row wants the retry-later that outlives the refusal.'
  issue: '#5318'

- test: TestRFC8A_CapacityRefusalWhileAWindowIsUnresolved
  message: 'the refused write is still parked on the seal''s sync: the capacity answer waited on the caller''s own fsync'
  status: fail
  fix: planned
  category: feature
  reason: 'What the row demonstrates, on its own bounded assertion now: the refusal over an unresolved window parks the refused write on the share seal''s caller-side fsync — the seal runs in the refusal''s own goroutine and syncs the records of the segment it closes, which the row''s held sync stops. What it waits on: the RFC 8 / RFC 28 ruling the PR text carries — whether the seal may place its marker without a caller-side sync, which the named-predecessor recovery refusal over an unsynced marker stands against, or whether the durability layer learns to seal off the caller''s goroutine. Once ruled, the refusal answers ErrDelay under a tenth of the caller''s bound and the entry leaves.'
  issue: '#4873'

- test: TestV26/journal/a_clone_of_a_lost_run_reads_lost_there
  message: 'the destination over the source''s lost run: <nil>, want ErrLost'
  status: fail
  fix: planned
  category: feature
  reason: 'sync marks reaching the engine''s journal open: a clone of a source whose synced run the journal lost reads ErrLost at the destination and the source''s bytes elsewhere. Init and Open work, and the open now empties the ended segment and serves, but nothing proves the rotted record synced, so the open reads it as a torn tail, cuts it and empties segment 3 without recording the loss, and the source and the destination read zeros over the lost run with a nil error. Cause: the engine keeps no sync marks: its journal open passes nil marks (pkg/block/engine/enginewire/enginewire.go), and JournalOf (pkg/block/engine/journalof.go) drops the marks Sync returns and stubs SyncMarks and MarksRecorded, so no mark proves it. The row waits on the journal keeping a per-stream sync mark that follows every completed sync, then on the engine dropping those stubs and handing the open its recorded marks.'
  issue: '#5261'
- test: TestRFC8A_TheJoin
  message: 'the lost extent reads "oooooooo", <nil>; want ErrLost'
  status: fail
  fix: planned
  category: feature
  reason: 'a committed hole reads zeros and a synced record the journal lost reads Lost after the restart. The row gets past the restart, but the lost extent serves the bytes it held before, superseded ones, and answers no error instead of ErrLost. Cause: after the restart the open cuts the corrupted record, the stream''s last synced record with nothing after it to prove it synced, as an unproven tail, and a loss counts only when a recorded mark proves it; the engine keeps no sync marks: its journal open passes nil marks (pkg/block/engine/enginewire/enginewire.go), and JournalOf (pkg/block/engine/journalof.go) drops the marks Sync returns and stubs SyncMarks and MarksRecorded, so no mark proves it. The row waits on the journal keeping a per-stream sync mark that follows every completed sync, then on the engine dropping those stubs and handing the open its recorded marks.'
  issue: '#5261'
- test: TestRFC8B_SharedJournal
  message: 'the filling write: engine: the share limit has nothing left to free'
  status: fail
  fix: planned
  category: feature
  reason: 'Waits on offload being composed. The settled answer gives retry-later for dirty bytes only with a put-healthy store behind them (RFC 8 section 10.2), and this part composes no store, so the settled no-space in settled() stands, as ruled on #4892; the row assumes a put-healthy store and goes green once offload reads the store put-health for the dirty half. The one journal share at its own limit takes the settled no-space answer where the row wants the refusal-later that never becomes no space while another share is healthy: the share''s bytes, none superseded, sit in a single active segment, so each refusal''s scoped pass seals and recycles that one segment whole and the candidacy the settled answer reads is left with nothing.'
  issue: '#5318'
- test: TestRFC8B_JournalFullOnAFullDevice
  message: 'answered vfs: retry shortly: capacity, want the device''s ErrNoSpace'
  status: fail
  fix: planned
  category: feature
  reason: 'the row''s write refused by the spare limit, for which the engine raises nothing (Engine.raiseFull in engine/repack.go): a write refused once the device has no room for a new segment raises journal_full and keeps it while writes into allocated segments are accepted. Init and Open work; with 1 MiB segments and every new create and allocation failing ENOSPC at the seam, the row gets past its writes to the refused roll and stops at its own check: the refused write answers retry-later capacity by its spare limit, not the device''s ErrNoSpace, with the fault fired and the pool''s device-full state set. A write reserves its spares through Pool.Hold (journal/internal/segment/pool.go), which refuses with the plain spare limit; only Stream.takeSpare turns that refusal into ENOSPC on a full device, and a reserved write never reaches it. So the cause is the journal''s reserved-write path, not this setup; it stays until the journal answers a Hold refused on a full device as itself (RFC 1 §6, RFC 8 §11.1).'
  issue: '#4611'
