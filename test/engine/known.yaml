# The engine's conformance tests that fail today, one entry per test, never a pattern, each
# naming the epic expected to turn it green. A test that starts to pass fails the run: remove
# its entry in the change that turned it green, a journal change included. Each entry's
# message is the failure it is known by: a test failing for any other reason is unexpected.
- test: TestRFC8A_SyncedLossReadsLost
  message: 'committed size 0 and charged 0, want 4096 and 0'
  status: fail
  fix: planned
  category: feature
  reason: 'a synced write the crash corrupted is committed as lost at start, charges nothing and reads ErrLost. The row restarts and finds the file empty: the committed size reads 0 and charged 0, want 4096 and 0, and the read answers nil, not ErrLost. Cause: after the restart the open cuts the corrupted record, the stream''s last synced record with nothing after it to prove it synced, as an unproven tail, and a loss counts only when a recorded mark proves it; the journal keeps a per-stream sync mark that follows the last sync that named a file of the stream and JournalOf serves it, so the group commit records marks, but this row syncs through the journal handle and crashes with no group commit after it, so no mark was recorded and the open is handed none. The row is owed a change, to commit through the engine and wait for a group commit before its crash, which #5444 tracks; a recorded mark would then meet the refusal: an open whose recorded mark proves a synced record lost, with no copy of it verifying, is refused (refuseLostTail, pkg/block/journal/internal/recovery/marks.go) until the journal''s reconcile half lands, so the row then reads the journal refused rather than ErrLost until that refusal is withdrawn too.'
  issue: '#5261'
- test: TestRFC8A_RetryLaterAtTheShareLimit
  message: 'the share limit has nothing left to free'
  status: fail
  fix: planned
  category: feature
  reason: 'Waits on offload being composed. The settled answer gives retry-later for dirty bytes only with a put-healthy store behind them (RFC 8 section 10.2), and this part composes no store, so the settled no-space in settled() stands, as ruled on #4892; the row assumes a put-healthy store and goes green once offload reads the store put-health for the dirty half. The journal''s repack is real and the ended-unreclaimed figure is served, and the row stops on the settled answer: the share at its limit holds nothing but live bytes, and the refusal''s two repack passes cycle them — each seals its copy target and retires it before the next — leaving not one sealed or ended segment standing, so the answer''s figure reads zero and the refusal ends no space.'
  issue: '#5318'

- test: TestRFC8A_Clone
  message: 'a clone its destination''s journal cannot reserve: engine: the share limit has nothing left to free'
  status: fail
  fix: planned
  category: feature
  reason: 'Waits on offload being composed. The settled answer gives retry-later for dirty bytes only with a put-healthy store behind them (RFC 8 section 10.2), and this part composes no store, so the settled no-space in settled() stands, as ruled on #4892; the row assumes a put-healthy store and goes green once offload reads the store put-health for the dirty half. The same settled answer as its retry-later sibling for the destination''s share: the destination''s journal limit refusal reads an ended-unreclaimed figure of zero once the refusal''s two repack passes have cycled the share''s live bytes, and answers no space where the row wants the retry-later that outlives the refusal.'
  issue: '#5318'


- test: TestV26/journal/a_clone_of_a_lost_run_reads_lost_there
  message: 'the destination over the source''s lost run: <nil>, want ErrLost'
  status: fail
  fix: planned
  category: feature
  reason: 'sync marks reaching the engine''s journal open: a clone of a source whose synced run the journal lost reads ErrLost at the destination and the source''s bytes elsewhere. Init and Open work, and the open now empties the ended segment and serves, but nothing proves the rotted record synced, so the open reads it as a torn tail, cuts it and empties segment 3 without recording the loss, and the source and the destination read zeros over the lost run with a nil error. Cause: the journal keeps a per-stream sync mark that follows the last sync that named a file of the stream and JournalOf serves it, so the group commit records marks, but the open this row restarts into is handed no recorded mark, so none proves the rotted record synced. The row is owed a change, to commit through the engine and wait for a group commit before its crash, which #5444 tracks; a recorded mark would then meet the refusal: an open whose recorded mark proves a synced record lost, with no copy of it verifying, is refused (refuseLostTail, pkg/block/journal/internal/recovery/marks.go) until the journal''s reconcile half lands, so the row then reads the journal refused rather than ErrLost until that refusal is withdrawn too.'
  issue: '#5261'
- test: TestRFC8A_TheJoin
  message: 'the lost extent reads "oooooooo", <nil>; want ErrLost'
  status: fail
  fix: planned
  category: feature
  reason: 'a committed hole reads zeros and a synced record the journal lost reads Lost after the restart. The row gets past the restart, but the lost extent serves the bytes it held before, superseded ones, and answers no error instead of ErrLost. Cause: after the restart the open cuts the corrupted record, the stream''s last synced record with nothing after it to prove it synced, as an unproven tail, and a loss counts only when a recorded mark proves it; the journal keeps a per-stream sync mark that follows the last sync that named a file of the stream and JournalOf serves it, so the group commit records marks, but the open this row restarts into is handed one recorded mark, which does not cover the corrupted record. The row is owed a change, to commit through the engine so a covering mark is recorded, which #5444 tracks; that mark would then meet the refusal: an open whose recorded mark proves a synced record lost, with no copy of it verifying, is refused (refuseLostTail, pkg/block/journal/internal/recovery/marks.go) until the journal''s reconcile half lands, so the row then reads the journal refused rather than ErrLost until that refusal is withdrawn too.'
  issue: '#5261'
- test: TestRFC8B_SharedJournal
  message: 'the filling write: engine: the share limit has nothing left to free'
  status: fail
  fix: planned
  category: feature
  reason: 'Waits on offload being composed. The settled answer gives retry-later for dirty bytes only with a put-healthy store behind them (RFC 8 section 10.2), and this part composes no store, so the settled no-space in settled() stands, as ruled on #4892; the row assumes a put-healthy store and goes green once offload reads the store put-health for the dirty half. The one journal share at its own limit takes the settled no-space answer where the row wants the refusal-later that never becomes no space while another share is healthy: the share''s bytes, none superseded, sit in a single active segment, so each refusal''s scoped pass seals and recycles that one segment whole and the candidacy the settled answer reads is left with nothing.'
  issue: '#5318'
