  category: feature
  reason: 'Epic 5: a deallocate larger than the journal''s free capacity reads as zeros; also the start (epic 6). Fails at the fixture until the journal has Init, Open, WriteAt, ReadAt and Deallocate.'
  issue: '#3588'
