# The engine's conformance tests that fail today, one entry per test, never a pattern, each
# naming the epic expected to turn it green. A test that starts to pass fails the run: remove
# its entry in the change that turned it green, a journal change included. Each entry's
# message is the failure it is known by: a test failing for any other reason is unexpected.
- test: TestRFC8A_StableWriteLazyExistence
  message: 'after the crash: committed size 24, mtime'
  status: fail
  fix: planned
  category: feature
  reason: 'the start''s re-application over the recovered journal: a write synced before its Commit survives the crash whole, its size committed at 24 and its bytes read back; the mtime it read at the write does not — the re-application carries the time of its own replay, not the record''s, so the committed mtime reads the wall clock, want the write''s. The row waits on the start''s replay carrying each record''s staged mtime.'
  issue: '#4210'
- test: TestRFC8C_DeclaredInterfaces
  message: 'the engine never calls 1 declared methods: [Journal.Draw]'
  status: fail
  fix: planned
  category: feature
  reason: 'the engine passing Journal.Draw as a method value (the method value in engine/write.go), which the architecture test counts as no call (uncalled in engine/conformance/arch_test.go): every other declared method is called, and the row reports Journal.Draw alone until the engine calls it directly.'
  issue: '#4206'
- test: TestRFC8A_AttachAfterDeviceLoss
  message: 'fixture: journal init: rename'
  status: fail
  fix: planned
  category: feature
  reason: 'the fixture''s Reinit under the crash seam (Fixture.Reinit in engine/enginetest/fixture.go): a re-initialised journal is refused until RecordJournal, then the share attaches above its old limit. Init and Open work; the fixture attaches the share and the journal reports its version counter, so the row gets past its first write and stops at the fixture''s journal re-initialisation, where the seam''s rename of the format file fails. Whether the seam or the fixture''s removal of the directory under it causes this is not settled.'
  issue: '#4206'
- test: TestRFC8A_RecoveryReappliesInVersionOrder
  message: 'committed size 4096 after the restart, want 12288'
  status: fail
  fix: planned
  category: feature
  reason: 'the start''s re-application over the recovered journal: a write, a truncate and a write past it replay in the journal''s order at start. The open recovers the segments, both writes re-apply and read back, but the truncate between them does not re-apply: the hole it leaves is never punched and the committed size reads 4096, want 12288. The row waits on the start''s replay applying the truncate, removals included, in version order.'
  issue: '#4210'
- test: TestRFC8A_SyncedLossReadsLost
  message: 'committed size 0 and charged 0, want 4096 and 0'
  status: fail
  fix: planned
  category: feature
  reason: 'a synced write the crash corrupted is committed as lost at start, charges nothing and reads ErrLost. The row restarts and finds the file empty: the committed size reads 0 and charged 0, want 4096 and 0, and the read answers nil, not ErrLost. Cause: after the restart the open cuts the corrupted record, the stream''s last synced record with nothing after it to prove it synced, as an unproven tail, and a loss counts only when a recorded mark proves it; the engine''s journal open passes nil marks (pkg/block/engine/enginewire.go), so no mark proves it. The row waits on the open being handed the recorded marks.'
  issue: '#4711'
- test: TestRFC8A_RecoveryUsage
  message: 'usage after recovery {Bytes:0 Files:2}, <nil>, want 8192 bytes'
  status: fail
  fix: planned
  category: feature
  reason: 'the start''s re-application over the recovered journal: the usage after recovery is the bytes re-applied, exactly, and a second restart leaves it unchanged. The open recovers the segments and both files re-apply, but the re-applied bytes are not charged to the share''s usage: it reads 0 bytes, want the 8192 re-applied. The row waits on the re-application charging its bytes to the usage.'
  issue: '#4210'
- test: TestRFC8A_VersionLimitRaise
  message: 'the raise halves need a block of 16'
  status: fail
  fix: planned
  category: feature
  reason: 'a block of 16 the conformance package cannot set (TestRFC8A_VersionLimitRaise): the raise halves of the version limit row, at a block of 16 the conformance package cannot set. Init and Open work; the fixture now attaches the share; the row stops at its own check: the raise halves need a block of 16, which this package cannot set yet. The journal''s Share, Draw and SetVersionLimit are built, so the knob is all the row waits for.'
  issue: '#4206'
- test: TestRFC8_SelfFenceVersionLimitRaise
  message: 'the failing raise fences the node'
  status: fail
  fix: planned
  category: feature
  reason: 'the engine''s version block, which the conformance package cannot set (versionBlock in engine/recover.go, set only by SetBlockForTest in engine/export_test.go): the version limit''s raise failing for 31s fences the node and its commit clears it. Init and Open work; the fixture attaches the share and the journal reports its version counter, so the row gets past its first write and stops at its own assertion: at a block of 2^24 the raise falls due only after half a block of draws, which one draw per poll never reaches within the bound, until the package can set a small block.'
  issue: '#4206'
- test: TestRFC8A_RemovalCrashedBetweenBatchesResumes
  message: 'want one with cursor 12288'
  status: fail
  fix: planned
  category: feature
  reason: 'the removal''s resume at recovery: a removal crashed between two batches resumes at the restart, the extent reads removed before the loop runs and after, and the record is pruned. The open recovers the segments and the row gets past its writes, their sync and the restart, but the rebuilt removals read done at their far cursors: no unfinished removal holds the mid-batch cursor 12288 the resume starts from. The row waits on the open rebuilding a removal''s progress at its cursor.'
  issue: '#4210'
- test: TestRFC8A_RemovalDoneNotPrunedIsPrunedAtRestart
  message: 'after the prune, want none'
  status: fail
  fix: planned
  category: feature
  reason: 'the removal''s prune at recovery: a release whose last batch committed and whose prune did not is pruned at the restart, and its index entry goes. The open recovers the segments and the row gets past its writes and the restart, but the release reads unfinished after the prune, wanting none, and the released file still holds its keys. The row waits on the start''s retirement pruning the removals the recovery finds done.'
  issue: '#4210'
- test: TestRFC8A_UnsuitableJournalAtStart
  message: 'the retry''s timer is set: not within 10s'
  status: fail
  fix: planned
  category: feature
  reason: 'the journal''s timers on the fixture clock (TestRFC8A_UnsuitableJournalAtStart, Fixture.start in engine/enginetest/fixture.go): a journal refused as unsuitable at start leaves its share unattached and named, and the retried open attaches it once the check clears. Init and Open work and the journal reports its version counter, so the row gets past its first write; it stops at the retry''s timer check (not within 10s) because the real journal''s own timers sit on the fixture clock, so the pending-timer count reads 6, not 1; the unit tests prove the engine side over the fake journal.'
  issue: '#4206'
- test: TestRFC8A_RetryLaterAtTheShareLimit
  message: 'the share limit has nothing left to free'
  status: fail
  fix: planned
  category: feature
  reason: 'The journal''s repack is real and the ended-unreclaimed figure is served, and the row stops on the settled answer: the share at its limit holds nothing but live bytes, and the refusal''s two repack passes cycle them — each seals its copy target and retires it before the next — leaving not one sealed or ended segment standing, so the answer''s figure reads zero and the refusal ends no space. The row waits on two things, filed apart: the engine''s settled answer composing RFC 8 section 10.2''s dirty-bytes disjunct (the live dirty bytes with the store put-healthy that keep retry-later), filed as the entry''s issue; and the share seal without a caller-side fsync, which the named-predecessor refusal at open (RFC 28 section 3.3) presently forbids over an unsynced seal marker, filed under #4873.'
  issue: '#4892'

- test: TestRFC8A_Clone
  message: 'a clone its destination''s journal cannot reserve: engine: the share limit has nothing left to free'
  status: fail
  fix: planned
  category: feature
  reason: 'The same settled answer as its retry-later sibling for the destination''s share: the destination''s journal limit refusal reads an ended-unreclaimed figure of zero once the refusal''s two repack passes have cycled the share''s live bytes, and answers no space where the row wants the retry-later that outlives the refusal. The row waits on the same two things the sibling''s entry names, filed apart as its issue and #4873.'
  issue: '#4892'

- test: TestRFC8A_CapacityRefusalWhileAWindowIsUnresolved
  message: 'the refused write is still parked on the seal''s sync: the capacity answer waited on the caller''s own fsync'
  status: fail
  fix: planned
  category: feature
  reason: 'What the row demonstrates, on its own bounded assertion now: the refusal over an unresolved window parks the refused write on the share seal''s caller-side fsync — the seal runs in the refusal''s own goroutine and syncs the records of the segment it closes, which the row''s held sync stops. What it waits on: the RFC 8 / RFC 28 ruling the PR text carries — whether the seal may place its marker without a caller-side sync, which the named-predecessor recovery refusal over an unsynced marker stands against, or whether the durability layer learns to seal off the caller''s goroutine. Once ruled, the refusal answers ErrDelay under a tenth of the caller''s bound and the entry leaves.'
  issue: '#4873'

- test: TestV26/journal/a_clone_of_a_lost_run_reads_lost_there
  message: 'the destination over the source''s lost run: <nil>, want ErrLost'
  status: fail
  fix: planned
  category: feature
  reason: 'sync marks reaching the engine''s journal open: a clone of a source whose synced run the journal lost reads ErrLost at the destination and the source''s bytes elsewhere. Init and Open work, and the open now empties the ended segment and serves, but the engine opens its journal with no sync marks (pkg/block/engine/enginewire/enginewire.go), so nothing proves the rotted record synced: the open reads it as a torn tail, cuts it, empties segment 3 without recording the loss, and the source and the destination read zeros over the lost run with a nil error, until the engine reads its recorded sync marks and hands them to the open.'
  issue: '#4711'
- test: TestContentSuiteOverTheJournal/ALossChangesTheVerifierAndRaisesTheLossSequence
  message: 'the Content under test cannot be made to lose a write'
  status: skip
  fix: planned
  category: feature
  reason: 'the fixture failing one file''s sync window (internal/vfs/integration/content_journal_test.go:18): a loss changes the verifier and raises only the lost file''s loss sequence. The run supplies no Lose, so the case skips: the fixture fails a whole sync window, every file pending in it, where the case needs one file''s content lost and another''s loss sequence left alone; the engine''s run over the fake journal covers it. It runs once the fixture can fail one file''s window.'
  issue: '#4206'
- test: TestRFC8A_TheJoin
  message: 'the lost extent reads "oooooooo", <nil>; want ErrLost'
  status: fail
  fix: planned
  category: feature
  reason: 'a committed hole reads zeros and a synced record the journal lost reads Lost after the restart. The row gets past the restart, but the lost extent serves the bytes it held before, superseded ones, and answers no error instead of ErrLost. Cause: after the restart the open cuts the corrupted record, the stream''s last synced record with nothing after it to prove it synced, as an unproven tail, and a loss counts only when a recorded mark proves it; the engine''s journal open passes nil marks (pkg/block/engine/enginewire.go), so no mark proves it. The row waits on the open being handed the recorded marks.'
  issue: '#4711'
- test: TestRFC8B_SharedJournal
  message: 'the filling write: engine: the share limit has nothing left to free'
  status: fail
  fix: planned
  category: feature
  reason: 'The one journal share at its own limit takes the settled no-space answer where the row wants the refusal-later that never becomes no space while another share is healthy: the share''s bytes, none superseded, sit in a single active segment, so each refusal''s scoped pass seals and recycles that one segment whole and the candidacy the settled answer reads is left with nothing. The share rides the same two things the no-space cluster does, filed apart: the engine''s settled answer composing the dirty-bytes disjunct that keeps retry-later (the entry''s issue), and the seal that owes no caller-side fsync (#4873). At the base line it only passed the interim retry-later of the not-built repack.'
  issue: '#4892'
- test: TestRFC8B_JournalFullOnAFullDevice
  message: 'answered vfs: retry shortly: capacity, want the device''s ErrNoSpace'
  status: fail
  fix: planned
  category: feature
  reason: 'the row''s write refused by the spare limit, for which the engine raises nothing (Engine.raiseFull in engine/repack.go): a write refused once the device has no room for a new segment raises journal_full and keeps it while writes into allocated segments are accepted. Init and Open work; with 1 MiB segments and every new create and allocation failing ENOSPC at the seam, the row gets past its writes to the refused roll and stops at its own check: the refused write answers retry-later capacity by its spare limit, not the device''s ErrNoSpace, with the fault fired and the pool''s device-full state set. A write reserves its spares through Pool.Hold (journal/internal/segment/pool.go), which refuses with the plain spare limit; only Stream.takeSpare turns that refusal into ENOSPC on a full device, and a reserved write never reaches it. So the cause is the journal''s reserved-write path, not this setup; it stays until the journal answers a Hold refused on a full device as itself (RFC 1 §6, RFC 8 §11.1).'
  issue: '#4611'
