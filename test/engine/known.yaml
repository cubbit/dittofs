# The engine's conformance tests that fail today, one entry per test, never a pattern, each
# naming the epic expected to turn it green. A test that starts to pass fails the run: remove
# its entry in the change that turned it green, a journal change included. Each entry's
# message is the failure it is known by: a test failing for any other reason is unexpected.
- test: TestRFC8A_SyncedLossReadsLost
  message: 'Read = vfs: retry shortly: frozen, want ErrLost'
  status: fail
  fix: planned
  category: feature
  reason: 'a synced write the crash corrupted is committed as lost at start, charges nothing and reads ErrLost. The row commits the file through the engine and commits another file''s existence after it, so the group commit records a sync mark covering the corrupted record, the stream''s last, and the restart hands it to the open; an open whose recorded mark proves a synced record lost, with no copy of it verifying, is refused (refuseLostTail, pkg/journal/internal/recovery/marks.go) until the journal''s reconcile half lands, so the share is refused at start and serves only the frozen delay; the row goes green once that refusal is withdrawn and the open reads the proved lost tail as lost.'
  issue: '#5261'
- test: TestRFC8A_RetryLaterAtTheShareLimit
  message: 'the share limit has nothing left to free'
  status: fail
  fix: planned
  category: feature
  reason: 'Waits on offload being composed. The settled answer gives retry-later for dirty bytes only with a put-healthy store behind them (RFC 8 section 10.2), and this part composes no store, so the settled no-space in settled() stands, as ruled on #4892; the row assumes a put-healthy store and goes green once offload reads the store put-health for the dirty half. The journal''s repack is real and the ended-unreclaimed figure is served, and the row stops on the settled answer: the share at its limit holds nothing but live bytes, and the refusal''s two repack passes cycle them — each seals its copy target and retires it before the next — leaving not one sealed or ended segment standing, so the answer''s figure reads zero and the refusal ends no space.'
  issue: '#5318'

- test: TestRFC8A_Clone
  message: 'a clone its destination''s journal cannot reserve: engine: the share limit has nothing left to free'
  status: fail
  fix: planned
  category: feature
  reason: 'Waits on offload being composed. The settled answer gives retry-later for dirty bytes only with a put-healthy store behind them (RFC 8 section 10.2), and this part composes no store, so the settled no-space in settled() stands, as ruled on #4892; the row assumes a put-healthy store and goes green once offload reads the store put-health for the dirty half. The same settled answer as its retry-later sibling for the destination''s share: the destination''s journal limit refusal reads an ended-unreclaimed figure of zero once the refusal''s two repack passes have cycled the share''s live bytes, and answers no space where the row wants the retry-later that outlives the refusal.'
  issue: '#5318'

- test: TestRFC8A_CloneResumedAtAFullLimit
  message: 'the share limit has nothing left to free: vfs: no space without operator action, want only the capacity delay'
  status: fail
  fix: planned
  category: feature
  reason: 'Waits on offload being composed. The settled answer gives retry-later for dirty bytes only with a put-healthy store behind them (RFC 8 section 10.2), and this part composes no store, so the settled no-space in settled() stands, as ruled on #4892; the row fills its share with live, dirty bytes and wants the retry-later a put-healthy store would give. The share-limit refusal now runs one pass per share that repacks only when the share''s unreclaimed bytes after its sync are above zero: the filler supersedes nothing, so no pass repacks, the ended figure reads zero and the refusal answers no space, as its retry-later sibling at the share limit does. It passed before only because the refusal''s two repack passes sealed and cycled the live bytes, leaving an ended figure the settled answer read as something to free.'
  issue: '#5318'

- test: TestRFC8A_TheJoin
  message: 'read 4096 bytes at 8192: 0, vfs: retry shortly: frozen'
  status: fail
  fix: planned
  category: feature
  reason: 'a committed hole reads zeros and a synced record the journal lost reads Lost after the restart. The row commits its overwrite through the engine, which returns once a recorded sync mark covers the record, the stream''s last, and the restart hands that mark to the open; an open whose recorded mark proves a synced record lost, with no copy of it verifying, is refused (refuseLostTail, pkg/journal/internal/recovery/marks.go) until the journal''s reconcile half lands, so the share is refused at start and serves only the frozen delay; the row goes green once that refusal is withdrawn and the open reads the proved lost tail as lost.'
  issue: '#5261'
- test: TestRFC8B_SharedJournal
  message: 'the filling write: engine: the share limit has nothing left to free'
  status: fail
  fix: planned
  category: feature
  reason: 'Waits on offload being composed. The settled answer gives retry-later for dirty bytes only with a put-healthy store behind them (RFC 8 section 10.2), and this part composes no store, so the settled no-space in settled() stands, as ruled on #4892; the row assumes a put-healthy store and goes green once offload reads the store put-health for the dirty half. The one journal share at its own limit takes the settled no-space answer where the row wants the refusal-later that never becomes no space while another share is healthy: the share''s bytes, none superseded, sit in a single active segment, so each refusal''s scoped pass seals and recycles that one segment whole and the candidacy the settled answer reads is left with nothing.'
  issue: '#5318'
