# The system scenarios that fail today, with the issue each reproduces. A scenario that starts to
# pass is an unexpected pass: remove its entry in the fix.
# Until the node's settings table declares the store, namespace and adapter sections, every scenario
# stops in setup, where the first store create is refused: its remote.* keys are unknown. setup.sh
# exits 3 only for a run that stopped at that store create, and 1 for any earlier setup failure and
# for a scenario's own failure, so each entry is known only with the message "exited 3", and any
# other failure is a new one.
# A scenario with a bug of its own has a reason that names where its run stops past setup, which the
# change that makes setup pass turns into the entry's message and issue; that change removes the
# others' entries, which then pass.
