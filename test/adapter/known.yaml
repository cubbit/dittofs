# The adapters' specifications that fail today, one entry per test, never a pattern, each naming
# the epic expected to turn it green. A test that starts to pass fails the run: remove its entry
# in the change that turned it green. Each entry's message is the failure it is known by: a test
# failing for any other reason is unexpected.
