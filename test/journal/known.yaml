# The journal's conformance tests that fail or skip today, one entry per test, never a pattern, each
# naming the epic expected to turn it green. A test that starts to pass fails the run: remove
# its entry in the change that turned it green. Each entry's message is text the test's output
# must contain for its failure or skip to count as the one listed; an entry with no message
# stands for any output of the test it names. Open now works for a directory holding no
# segment, so the failing tests fail past the fixture: on a journal call not yet written, which
# the checks fail with "stub:", on a reopen of a journal that has run, which the fixture refuses
# with "fixture:", or on a journal that does not yet refuse what the RFC refuses -- and any
# other failure is graded new.

