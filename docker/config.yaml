# Server configuration for the repository's docker-compose.yml, in this
# release's keys. Only the settings that differ from the built-in defaults are
# listed.
#
# This file alone does not start a node: `dfs init` and `dfs start` also need
# node.id and the storage key (keys.storage), and the API serves off loopback
# only with a certificate (api.tls). The compose stack's move to them, and to
# `dfs init` as its own step, is its own change.

logging:
  # Defaults to a file under the state directory; `docker compose logs` reads stdout.
  output: "stdout"

metadata:
  badger:
    # The compose file's metadata volume.
    path: "/data/metadata"

journals:
  # The compose file's journal volume. The journal holds the only copy of every
  # byte written, so it never lives in the container's writable layer.
  - path: "/data/blocks"
