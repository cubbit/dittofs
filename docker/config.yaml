# Server configuration for the repository's docker-compose.yml, in this
# release's keys. Only the settings that differ from the built-in defaults are
# listed.
#
# This file alone does not start a node: `dfs init` and `dfs start` also need
# node.id and the storage key (keys.storage), and the API serves off loopback
# only with a certificate (api.tls).

logging:
  # Defaults to a file under the state directory; `docker compose logs` reads stdout.
  output: "stdout"

metadata:
  badger:
    # A directory on the compose file's metadata volume, never its mount point:
    # `dfs init` creates it.
    path: "/data/metadata/store"

journals:
  # A directory on the compose file's journal volume, never its mount point.
  # `dfs init` needs it to exist; the image creates it, so a named volume starts
  # with it. The journal holds the only copy of every byte written, so it never
  # lives in the container's writable layer.
  - path: "/data/blocks/journal"
