<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RFC 16 — the metadata store</title>
  <link rel="stylesheet" href="../../third-party/reveal.js-5.2.1/reset.css">
  <link rel="stylesheet" href="../../third-party/reveal.js-5.2.1/reveal.css">
  <link rel="stylesheet" href="../../shared/deck.css">
</head>
<body>
<div class="reveal">
<div class="slides">

  <!-- Structure only: every sentence lives in i18n/<lang>.json. -->

  <section id="cover" class="center">
    <div class="kicker" data-i18n="cover.kicker"></div>
    <h1 data-i18n="cover.title"></h1>
    <p class="lead" data-i18n="cover.lead"></p>
    <div class="badges">
      <span class="badge" data-i18n="cover.built"></span>
    </div>
    <aside class="notes" data-i18n="cover.notes"></aside>
  </section>

  <section id="two" class="center">
    <div class="kicker" data-i18n="intro.kicker"></div>
    <h2 data-i18n="intro.twoTitle"></h2>
    <p class="lead" data-i18n="intro.two"></p>
    <aside class="notes" data-i18n="intro.twoNotes"></aside>
  </section>

  <section id="known" data-term-list="known" data-style="chips">
    <div class="kicker" data-i18n="intro.kicker"></div>
    <h2><span data-i18n="intro.knownTitle"></span><span data-page-counter></span></h2>
    <p class="muted" data-i18n="intro.knownLead"></p>
    <div data-term-host></div>
    <aside class="notes" data-i18n="intro.knownNotes"></aside>
  </section>

  <section id="new" data-term-list="new" data-per-slide="4">
    <div class="kicker" data-i18n="intro.kicker"></div>
    <h2><span data-i18n="intro.newTitle"></span><span data-page-counter></span></h2>
    <div data-term-host></div>
    <aside class="notes" data-i18n="intro.newNotes"></aside>
  </section>

  <section id="clash" data-term-list="conflicts" data-per-slide="3">
    <div class="kicker" data-i18n="intro.kicker"></div>
    <h2><span data-i18n="intro.clashTitle"></span><span data-page-counter></span></h2>
    <div data-term-host></div>
    <aside class="notes" data-i18n="intro.clashNotes"></aside>
  </section>

  <section id="problem">
    <div class="kicker" data-i18n="problem.kicker"></div>
    <h2 data-i18n="problem.title"></h2>
    <div class="cols">
      <div class="card accent"><h3 data-i18n="problem.analogyTitle"></h3><p data-i18n="problem.analogy"></p></div>
      <div class="card warn-card"><h3 data-i18n="problem.stopsTitle"></h3><p data-i18n="problem.stops"></p></div>
    </div>
    <p data-i18n="problem.split"></p>
    <aside class="notes" data-i18n="problem.notes"></aside>
  </section>

  <section id="promises">
    <div class="kicker" data-i18n="problem.kicker"></div>
    <h2 data-i18n="promises.title"></h2>
    <ul class="small" data-i18n-list="promises.items" data-fragments></ul>
    <aside class="notes" data-i18n="promises.notes"></aside>
  </section>

  <section id="views">
    <div class="kicker" data-i18n="model.kicker"></div>
    <h2 data-i18n="views.title"></h2>
    <div class="scene one" data-scene="views">
      <ol class="captions" data-i18n-list="scenes.views.steps"></ol>
    </div>
    <aside class="notes" data-i18n="views.notes"></aside>
  </section>

  <section id="rules3">
    <div class="kicker" data-i18n="model.kicker"></div>
    <h2 data-i18n="rules3.title"></h2>
    <div class="cols3">
      <div class="card"><h3 data-i18n="rules3.c1Title"></h3><p class="small" data-i18n="rules3.c1"></p></div>
      <div class="card"><h3 data-i18n="rules3.c2Title"></h3><p class="small" data-i18n="rules3.c2"></p></div>
      <div class="card"><h3 data-i18n="rules3.c3Title"></h3><p class="small" data-i18n="rules3.c3"></p></div>
    </div>
    <aside class="notes" data-i18n="rules3.notes"></aside>
  </section>

  <section id="example">
    <div class="kicker" data-i18n="example.kicker"></div>
    <h2 data-i18n="example.title"></h2>
    <div class="scene one" data-scene="example">
      <ol class="captions" data-i18n-list="scenes.example.steps"></ol>
    </div>
    <aside class="notes" data-i18n="example.notes"></aside>
  </section>

  <section id="measured">
    <div class="kicker" data-i18n="example.kicker"></div>
    <h2 data-i18n="measured.title"></h2>
    <div class="stats">
      <div class="stat"><div class="num" data-i18n="measured.n1"></div><div class="what" data-i18n="measured.w1"></div></div>
      <div class="stat"><div class="num" data-i18n="measured.n2"></div><div class="what" data-i18n="measured.w2"></div></div>
      <div class="stat"><div class="num" data-i18n="measured.n3"></div><div class="what" data-i18n="measured.w3"></div></div>
    </div>
    <p data-i18n="measured.footer"></p>
    <aside class="notes" data-i18n="measured.notes"></aside>
  </section>

  <section id="keys">
    <div class="kicker" data-i18n="model.kicker"></div>
    <h2 data-i18n="keys.title"></h2>
    <table data-i18n-table="keys.table"></table>
    <p class="small" data-i18n="keys.footer"></p>
    <aside class="notes" data-i18n="keys.notes"></aside>
  </section>

  <section id="kv">
    <div class="kicker" data-i18n="kv.kicker"></div>
    <h2 data-i18n="kv.title"></h2>
    <div class="cols wide-left">
<pre class="code-sm"><code>type KV interface {
  Update(ctx, fn func(Txn) error) error
  View(ctx, fn func(Reader) error) error
  Limits() TxnLimits
}
// Reader: Get Scan Before Versions
// Txn: Reader + Set Delete
//      Guard GuardRange Now</code></pre>
      <ul class="small" data-i18n-list="kv.items"></ul>
    </div>
    <aside class="notes" data-i18n="kv.notes"></aside>
  </section>

  <section id="guards">
    <div class="kicker" data-i18n="kv.kicker"></div>
    <h2 data-i18n="guards.title"></h2>
    <div class="scene one" data-scene="guards">
      <ol class="captions" data-i18n-list="scenes.guards.steps"></ol>
    </div>
    <aside class="notes" data-i18n="guards.notes"></aside>
  </section>

  <section id="guardrules">
    <div class="kicker" data-i18n="kv.kicker"></div>
    <h2 data-i18n="guardrules.title"></h2>
    <table data-i18n-table="guardrules.table"></table>
    <p class="small" data-i18n="guardrules.footer"></p>
    <aside class="notes" data-i18n="guardrules.notes"></aside>
  </section>

  <section id="quiz-guards" data-quiz="quizGuards" data-answer="c">
    <aside class="notes" data-i18n="quizGuards.notes"></aside>
  </section>

  <section id="isolation">
    <div class="kicker" data-i18n="kv.kicker"></div>
    <h2 data-i18n="isolation.title"></h2>
    <ul class="small" data-i18n-list="isolation.items"></ul>
    <div class="card bad"><p class="small" data-i18n="isolation.rule"></p></div>
    <aside class="notes" data-i18n="isolation.notes"></aside>
  </section>

  <section id="durable">
    <div class="kicker" data-i18n="kv.kicker"></div>
    <h2 data-i18n="durable.title"></h2>
    <div class="scene one" data-scene="commit">
      <ol class="captions" data-i18n-list="scenes.commit.steps"></ol>
    </div>
    <p class="muted small" data-i18n="durable.footer"></p>
    <aside class="notes" data-i18n="durable.notes"></aside>
  </section>

  <section id="time">
    <div class="kicker" data-i18n="kv.kicker"></div>
    <h2 data-i18n="time.title"></h2>
    <div class="cols3">
      <div class="card"><h3 data-i18n="time.c1Title"></h3><p class="small" data-i18n="time.c1"></p></div>
      <div class="card"><h3 data-i18n="time.c2Title"></h3><p class="small" data-i18n="time.c2"></p></div>
      <div class="card"><h3 data-i18n="time.c3Title"></h3><p class="small" data-i18n="time.c3"></p></div>
    </div>
    <p class="muted small" data-i18n="time.footer"></p>
    <aside class="notes" data-i18n="time.notes"></aside>
  </section>

  <section id="counters">
    <div class="kicker" data-i18n="kv.kicker"></div>
    <h2 data-i18n="counters.title"></h2>
    <p class="muted" data-i18n="counters.lead"></p>
    <table data-i18n-table="counters.table"></table>
    <p class="small" data-i18n="counters.footer"></p>
    <aside class="notes" data-i18n="counters.notes"></aside>
  </section>

  <section id="fold">
    <div class="kicker" data-i18n="kv.kicker"></div>
    <h2 data-i18n="fold.title"></h2>
    <ul class="small" data-i18n-list="fold.items"></ul>
    <aside class="notes" data-i18n="fold.notes"></aside>
  </section>

  <section id="quiz-fold" data-quiz="quizFold" data-answer="b">
    <aside class="notes" data-i18n="quizFold.notes"></aside>
  </section>

  <section id="quota">
    <div class="kicker" data-i18n="kv.kicker"></div>
    <h2 data-i18n="quota.title"></h2>
    <ul class="small" data-i18n-list="quota.items"></ul>
    <div class="card warn-card"><h3 data-i18n="quota.decisionTitle"></h3><p class="small" data-i18n="quota.decision"></p></div>
    <aside class="notes" data-i18n="quota.notes"></aside>
  </section>

  <section id="entities">
    <div class="kicker" data-i18n="entities.kicker"></div>
    <h2 data-i18n="entities.title"></h2>
    <table data-i18n-table="entities.table"></table>
    <p class="small" data-i18n="entities.footer"></p>
    <aside class="notes" data-i18n="entities.notes"></aside>
  </section>

  <section id="identity">
    <div class="kicker" data-i18n="entities.kicker"></div>
    <h2 data-i18n="identity.title"></h2>
    <ul class="small" data-i18n-list="identity.items"></ul>
    <aside class="notes" data-i18n="identity.notes"></aside>
  </section>

  <section id="controlplane">
    <div class="kicker" data-i18n="entities.kicker"></div>
    <h2 data-i18n="controlplane.title"></h2>
    <p data-i18n="controlplane.lead"></p>
    <table data-i18n-table="controlplane.table"></table>
    <aside class="notes" data-i18n="controlplane.notes"></aside>
  </section>

  <section id="shares">
    <div class="kicker" data-i18n="entities.kicker"></div>
    <h2 data-i18n="shares.title"></h2>
    <p class="small" data-i18n="shares.lead"></p>
    <table data-i18n-table="shares.table"></table>
    <p class="muted small" data-i18n="shares.footer"></p>
    <aside class="notes" data-i18n="shares.notes"></aside>
  </section>

  <section id="removal1">
    <div class="kicker" data-i18n="removal1.kicker"></div>
    <h2 data-i18n="removal1.title"></h2>
    <ol class="small" data-i18n-list="removal1.steps" data-fragments></ol>
    <p class="muted small" data-i18n="removal1.footer"></p>
    <aside class="notes" data-i18n="removal1.notes"></aside>
  </section>

  <section id="removal2">
    <div class="kicker" data-i18n="removal1.kicker"></div>
    <h2 data-i18n="removal2.title"></h2>
    <ol class="small" data-i18n-list="removal2.steps"></ol>
    <div class="card warn-card"><p class="small" data-i18n="removal2.decision"></p></div>
    <aside class="notes" data-i18n="removal2.notes"></aside>
  </section>

  <section id="format">
    <div class="kicker" data-i18n="format.kicker"></div>
    <h2 data-i18n="format.title"></h2>
    <ol data-i18n-list="format.steps" data-fragments></ol>
    <p class="muted small" data-i18n="format.footer"></p>
    <aside class="notes" data-i18n="format.notes"></aside>
  </section>

  <section id="foldrules">
    <div class="kicker" data-i18n="format.kicker"></div>
    <h2 data-i18n="foldrules.title"></h2>
    <p class="small" data-i18n="foldrules.lead"></p>
    <ul class="small" data-i18n-list="foldrules.items"></ul>
    <p class="muted small" data-i18n="foldrules.footer"></p>
    <aside class="notes" data-i18n="foldrules.notes"></aside>
  </section>

  <section id="quiz-format" data-quiz="quizFormat" data-answer="a">
    <aside class="notes" data-i18n="quizFormat.notes"></aside>
  </section>

  <section id="inspect">
    <div class="kicker" data-i18n="inspect.kicker"></div>
    <h2 data-i18n="inspect.title"></h2>
    <ul class="small" data-i18n-list="inspect.items"></ul>
    <aside class="notes" data-i18n="inspect.notes"></aside>
  </section>

  <section id="testing">
    <div class="kicker" data-i18n="testing.kicker"></div>
    <h2 data-i18n="testing.title"></h2>
    <div class="cols">
      <div class="card"><h3 data-i18n="testing.c1Title"></h3><p class="small" data-i18n="testing.c1"></p></div>
      <div class="card"><h3 data-i18n="testing.c2Title"></h3><p class="small" data-i18n="testing.c2"></p></div>
    </div>
    <p class="muted small" data-i18n="testing.footer"></p>
    <aside class="notes" data-i18n="testing.notes"></aside>
  </section>

  <section id="footprint">
    <div class="kicker" data-i18n="footprint.kicker"></div>
    <h2 data-i18n="footprint.title"></h2>
    <div class="stats">
      <div class="stat"><div class="num" data-i18n="footprint.n1"></div><div class="what" data-i18n="footprint.w1"></div></div>
      <div class="stat"><div class="num" data-i18n="footprint.n2"></div><div class="what" data-i18n="footprint.w2"></div></div>
      <div class="stat"><div class="num" data-i18n="footprint.n3"></div><div class="what" data-i18n="footprint.w3"></div></div>
      <div class="stat"><div class="num" data-i18n="footprint.n4"></div><div class="what" data-i18n="footprint.w4"></div></div>
      <div class="stat"><div class="num" data-i18n="footprint.n5"></div><div class="what" data-i18n="footprint.w5"></div></div>
      <div class="stat"><div class="num" data-i18n="footprint.n6"></div><div class="what" data-i18n="footprint.w6"></div></div>
    </div>
    <p class="muted small" data-i18n="footprint.footer"></p>
    <aside class="notes" data-i18n="footprint.notes"></aside>
  </section>

  <section id="rules">
    <div class="kicker" data-i18n="rules.kicker"></div>
    <h2 data-i18n="rules.title"></h2>
    <ul class="small" data-i18n-list="rules.items"></ul>
    <p class="muted small" data-i18n="rules.footer"></p>
    <aside class="notes" data-i18n="rules.notes"></aside>
  </section>

  <section id="nongoals">
    <div class="kicker" data-i18n="rules.kicker"></div>
    <h2 data-i18n="nongoals.title"></h2>
    <ul data-i18n-list="nongoals.items"></ul>
    <p class="muted small" data-i18n="nongoals.footer"></p>
    <aside class="notes" data-i18n="nongoals.notes"></aside>
  </section>

  <section id="open">
    <div class="kicker" data-i18n="open.kicker"></div>
    <h2 data-i18n="open.title"></h2>
    <ol data-i18n-list="open.questions"></ol>
    <aside class="notes" data-i18n="open.notes"></aside>
  </section>


  <section id="glossary" data-glossary data-per-slide="4">
    <div class="kicker" data-i18n="glossaryKicker"></div>
    <h2><span data-i18n="glossaryTitle"></span><span data-page-counter></span></h2>
    <div data-term-host></div>
  </section>

</div>
</div>
<script type="module">
  import { boot } from '../../shared/deck.js';
  import scenes from './scenes/index.js';
  boot({ scenes }).catch((err) => {
    document.body.insertAdjacentHTML('afterbegin', `<pre style="color:#b8322a;padding:16px">${String(err).replace(/</g, '&lt;')}</pre>`);
    throw err;
  });
</script>
</body>
</html>
