name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v0.1.0, etc.

permissions: {}

jobs:
  release:
    name: Create Release
    needs: tarball-foundationdb
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # Required for cosign keyless OIDC signing
    env:
      S3_BUCKET: dittofs-binaries
      S3_ENDPOINT: https://s3.cubbit.eu

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0  # Full history for changelog generation

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Linux packaging tools
        run: |
          # Drop the runner image's pre-configured Microsoft apt repos; they
          # periodically break signing verification and fail apt-get update
          # (NOSPLIT / "no longer signed"). We don't need them here.
          sudo bash -c 'grep -rlZ packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null || true' | sudo xargs -0r rm -f
          sudo apt-get update && sudo apt-get install -y dpkg-dev createrepo-c

      # .goreleaser.yml names them in its checksums and release files, so the
      # one signed checksums.txt covers them too.
      - name: Download the FoundationDB tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist-foundationdb
          pattern: foundationdb-tarball-*
          merge-multiple: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@9a127d869fb706213d29cdf8eef3a4ea2b869415 # v7
        with:
          distribution: goreleaser
          version: "~> v2.15"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

      - name: Add the CHANGELOG.md section to the release notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/body.md"
          python3 scripts/release-notes.py "$TAG" < "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Linux repositories
        run: ./scripts/publish-linux-repos.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Upload packages to S3
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"

          shopt -s nullglob
          ARTIFACTS=(dist/*.deb dist/*.rpm dist/*.pkg.tar.zst)
          if [ ${#ARTIFACTS[@]} -eq 0 ]; then
            echo "::error::No Linux packages found in dist/"
            exit 1
          fi
          echo "Uploading ${#ARTIFACTS[@]} packages:"
          printf '  %s\n' "${ARTIFACTS[@]}"

          for f in "${ARTIFACTS[@]}"; do
            aws s3 cp "$f" "s3://${S3_BUCKET}/${VERSION}/$(basename "$f")" \
              --endpoint-url "${S3_ENDPOINT}" \
              --acl public-read
          done

          # Upload version marker for install script auto-detection (skip pre-releases)
          if [[ "${VERSION}" != *-* ]]; then
            echo "${VERSION}" | aws s3 cp - "s3://${S3_BUCKET}/latest" \
              --endpoint-url "${S3_ENDPOINT}" \
              --acl public-read \
              --content-type "text/plain"
          fi

          # Upload install script to bucket root (always latest)
          if [ -f scripts/install.sh ]; then
            aws s3 cp scripts/install.sh "s3://${S3_BUCKET}/install.sh" \
              --endpoint-url "${S3_ENDPOINT}" \
              --acl public-read \
              --content-type "text/plain"
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Verify uploaded artifacts are publicly accessible
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          BASE="${S3_ENDPOINT}/${S3_BUCKET}"
          FAILED=0

          check_url() {
            local url="$1" level="${2:-error}"
            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" -I "$url")
            if [ "$code" != "200" ]; then
              echo "::${level}::${url} returned HTTP ${code} (expected 200)"
              [ "$level" = "error" ] && FAILED=1
            else
              echo "ok  $url"
            fi
          }

          # Verify Linux packages
          shopt -s nullglob
          ARTIFACTS=(dist/*.deb dist/*.rpm dist/*.pkg.tar.zst)
          if [ ${#ARTIFACTS[@]} -eq 0 ]; then
            echo "::error::No Linux packages found in dist/ — nothing to verify"
            exit 1
          fi
          for f in "${ARTIFACTS[@]}"; do
            check_url "${BASE}/${VERSION}/$(basename "$f")"
          done

          # Verify additional required files
          check_url "${BASE}/install.sh"
          if [[ "${VERSION}" != *-* ]]; then
            check_url "${BASE}/latest"
          fi

          # Verify APT repo
          for path in apt/dists/stable/Release apt/dists/stable/InRelease apt/dittofs.gpg.key; do
            check_url "${BASE}/${path}" warning
          done

          # Verify YUM repo
          for path in rpm/repodata/repomd.xml rpm/dfs.repo; do
            check_url "${BASE}/${path}" warning
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more release artifacts are not publicly accessible — check bucket ACLs"
            exit 1
          fi

  # dfs with the foundationdb tag, as a Linux tarball per architecture. The
  # binary comes out of Dockerfile.foundationdb's builder, so it links the same
  # libfdb_c as the image and needs no newer glibc than Debian bookworm's. A
  # native runner each, since cgo does not cross-compile here.
  tarball-foundationdb:
    name: FoundationDB tarball (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Build dfs with the foundationdb tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          docker buildx build -f Dockerfile.foundationdb --target binary \
            --build-arg VERSION="${TAG#v}" \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output type=local,dest="$RUNNER_TEMP/bin" .

      - name: Pack the tarball
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p "$RUNNER_TEMP/out"
          cp README.md LICENSE packaging/FOUNDATIONDB.txt "$RUNNER_TEMP/bin/"
          tar -czf "$RUNNER_TEMP/out/dfs-foundationdb_${TAG#v}_Linux_${ARCH}.tar.gz" \
            -C "$RUNNER_TEMP/bin" dfs README.md LICENSE FOUNDATIONDB.txt

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: foundationdb-tarball-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # dfs with the foundationdb tag, as <tag>-foundationdb. cgo links libfdb_c,
  # so each platform builds on a native runner rather than under QEMU, and
  # pushes its image by digest alone; the manifest job below names them.
  image-foundationdb:
    name: FoundationDB image (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          {
            echo "TAG=${TAG}"
            echo "VERSION=${TAG#v}"
            echo "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile.foundationdb
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.DATE }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.created=${{ steps.version.outputs.DATE }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=marmos91c/dittofs,push-by-digest=true,name-canonical=true,push=true

      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: foundationdb-digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tags the two platform images as one, only once GoReleaser's job (and the
  # tests its before-hook runs) has passed, so a failed release names no image.
  image-foundationdb-manifest:
    name: FoundationDB image manifest
    needs: [release, image-foundationdb]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: foundationdb-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push the manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          sources=()
          for digest in *; do sources+=("marmos91c/dittofs@sha256:${digest}"); done
          docker buildx imagetools create -t "marmos91c/dittofs:${TAG}-foundationdb" "${sources[@]}"
          docker buildx imagetools inspect "marmos91c/dittofs:${TAG}-foundationdb"

  operator:
    name: Build Operator Image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: k8s/dittofs-operator/go.mod

      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          TAGS="marmos91c/dittofs-operator:${VERSION}"
          if [[ "${VERSION}" != *-* ]]; then
            TAGS="${TAGS},marmos91c/dittofs-operator:latest"
          fi
          echo "TAGS=${TAGS}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push operator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./k8s/dittofs-operator
          file: ./k8s/dittofs-operator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.TAGS }}
          labels: |
            org.opencontainers.image.title=DittoFS Operator
            org.opencontainers.image.description=Kubernetes operator for DittoFS
            org.opencontainers.image.url=https://github.com/cubbit/dittofs
            org.opencontainers.image.source=https://github.com/cubbit/dittofs
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0

  sync-docs:
    name: Sync docs to website
    runs-on: ubuntu-latest
    steps:
      - name: Trigger dittofs-web docs refresh
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          # Docs "Latest" tracks the newest stable tag; skip pre-release (rc) tags.
          if [[ "${VERSION}" == *-* ]]; then
            echo "Pre-release ${VERSION}; skipping docs sync."
            exit 0
          fi
          gh workflow run refresh-docs.yml --repo cubbit/dittofs-web -f ref="${VERSION}"
