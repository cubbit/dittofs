# Assign Reviewers: request one maintainer on every new PR, picked at random
# from the author's own reviewer pool. An author outside the table, or a pool
# emptied by an exclusion, falls back to any known maintainer but the author.
#
# A stacked PR, one whose base branch is the head of another open PR, instead
# inherits the people of the PR below it: its author, whoever is still
# requested there and whoever has already reviewed it, limited to the known
# maintainers and with the upper PR's author left out. So when A and B stack
# PRs on each other, each reviews the other's rather than a stranger from the
# pool. Only when that leaves nobody does it fall through to the pool.
#
# pull_request_target runs the copy of this file on the PR's base branch, so a
# PR is assigned only if its base branch carries this file. That is why the
# trigger has no branch filter: a stacked PR's base is a feature branch, and it
# is covered as long as that branch was cut after this file landed.
# It is safe for fork PRs because it never checks out or runs the PR's code.

name: Assign Reviewers

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Stacked PR: take the author and reviewers of the open PR whose head
          # is our base, keeping only the maintainers in the table below, so a
          # bot or an outside reviewer can't make --add-reviewer refuse the lot.
          # Our own author is left out. A failed lookup falls through to the
          # pool: the step runs under bash -e, so each lookup ends in `|| true`.
          #
          # decision: a base that is a long-lived branch is never stacked. A PR
          # whose head is develop, main or feat/storage-v2 (a landing or sync PR)
          # would otherwise hand its reviewers to every PR into that branch.
          #
          # decision: the journal rule further down is not applied here. A
          # stacked PR is reviewed in the context of the PR below it, so whoever
          # knows that one is the right reviewer even when rif's stacked change
          # touches the journal (a journal test fix on top of a harness PR).
          # Withdraw this if a stacked PR is ever where a journal change itself
          # needs a reviewer other than Lucian.
          known="didimelli llucian-iws rif viquitorreis marmos91 simonebaracchi AntonioBusillo"
          lower_pr=""
          case "$BASE" in
            develop|main|feat/storage-v2) ;;
            *) lower_pr=$(gh api -X GET "repos/$REPO/pulls" -f head="$OWNER:$BASE" -f state=open --jq '.[0].number // empty' || true) ;;
          esac
          if [ -n "$lower_pr" ]; then
            # All three lookups or none: a partial set would skip the pool.
            people=$(gh api "repos/$REPO/pulls/$lower_pr" --jq '.user.login' &&
              gh api "repos/$REPO/pulls/$lower_pr/requested_reviewers" --jq '.users[].login' &&
              gh api "repos/$REPO/pulls/$lower_pr/reviews" --paginate --jq '.[].user.login') || people=""
            inherited=$(printf '%s\n' "$people" | sort -u | grep -xF -f <(printf '%s\n' $known) | grep -vx "$AUTHOR" | paste -sd, - || true)
            if [ -n "$inherited" ]; then
              echo "Stacked on #$lower_pr: requesting $inherited"
              # GitHub refuses the whole list if it refuses one login: fall through to the pool.
              if gh pr edit "$PR" --repo "$REPO" --add-reviewer "$inherited"; then exit 0; fi
            fi
          fi

          case "$AUTHOR" in
            didimelli)      pool="rif viquitorreis marmos91 AntonioBusillo" ;;
            llucian-iws)    pool="rif viquitorreis simonebaracchi AntonioBusillo" ;;
            rif)            pool="llucian-iws viquitorreis marmos91 didimelli" ;;
            viquitorreis)   pool="rif simonebaracchi llucian-iws AntonioBusillo" ;;
            marmos91)       pool="simonebaracchi llucian-iws didimelli" ;;
            simonebaracchi) pool="marmos91 viquitorreis AntonioBusillo" ;;
            AntonioBusillo) pool="rif didimelli llucian-iws" ;;
          esac

          # Lucian does not review Radu's journal changes.
          # The files API, unlike gh pr diff, lists PRs past 300 files.
          if [ "$AUTHOR" = rif ] && gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' | grep -qE '^pkg/journal(v2)?/'; then
            pool="${pool/llucian-iws/}"
          fi

          # An author outside the team (Dependabot, an outside contributor) or an
          # emptied pool falls back to the known maintainers, not to every
          # collaborator with write access: that list also holds bots and people
          # who do not review here.
          [ -n "${pool// /}" ] || pool=$(printf '%s\n' $known | grep -vx "$AUTHOR")

          pick=$(printf '%s\n' $pool | shuf -n 1)
          gh pr edit "$PR" --repo "$REPO" --add-reviewer "$pick"
