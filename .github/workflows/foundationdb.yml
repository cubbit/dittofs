name: FoundationDB

# The FoundationDB backend's suites against a one-process server, which the unit
# tests skip for want of one. The job moved here from the unit tests' workflow
# when tests.yml took over the unit tests.
on:
  push:
    branches: [develop, feat/storage-v2]
  pull_request:
    branches: [develop, main, feat/storage-v2]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fdb:
    name: FoundationDB backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The same in-job filter as the unit tests, for the same reason: a job
      # whose steps are skipped reports success instead of pending forever.
      - name: Check for metadata store changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            kv:
              - 'pkg/metadata/kv/**'
              - 'pkg/metadata/kvstore/**'
              - 'pkg/metadata/entity/**'
              - 'test/fdb/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/actions/fdb-client/**'
              - '.github/actions/release-asset/**'
              - '.github/actions/go-cache/**'
              - '.github/workflows/foundationdb.yml'

      - name: Set up Go
        if: github.event_name != 'pull_request' || steps.filter.outputs.kv == 'true'
        id: go
        uses: ./.github/actions/go-cache
        with:
          go-version: "1.26.x"

      - name: Install the FoundationDB client
        if: github.event_name != 'pull_request' || steps.filter.outputs.kv == 'true'
        uses: ./.github/actions/fdb-client

      - name: Start a one-process FoundationDB
        if: github.event_name != 'pull_request' || steps.filter.outputs.kv == 'true'
        run: test/fdb/cluster.sh up 1

      # The backend's conformance suite and the store's suites, on the cluster
      # above: what the unit tests skip for want of a server.
      - name: Run the suites on FoundationDB
        if: github.event_name != 'pull_request' || steps.filter.outputs.kv == 'true'
        run: >
          DITTOFS_FDB_CLUSTER_FILE="$HOME/.cache/dittofs-fdb/data/fdb.cluster"
          go test -tags=foundationdb -race -count=1 -timeout=20m
          -run '^(TestConformance|TestNowAcrossNodes|TestUnknownCommitOutcomeNotReapplied|TestSweepClearsOnlyOldMarks|TestOpenIsolatesAndClears|TestStoreConformanceFDB|TestStoreConformanceFDBFrozenClock|FuzzNamespaceFDB|TestScanSkipsTheBackendsOwnRows|TestOpenRefusesAMissingTLSFile|TestOpenRefusesOtherTLSFiles|TestDatabaseBeforeOpenFixesTheClientWithoutTLS)$'
          ./pkg/metadata/kv/fdbkv/... ./pkg/metadata/kvstore/

      # Only a push run saves: a pull request run reads its base branch's
      # entries and every run reads the default branch's, while what a pull
      # request run saves only that pull request's runs can read.
      - name: Save the Go caches
        if: github.event_name == 'push' && steps.go.outputs.cache-hit != 'true' && steps.go.outputs.key != ''
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go.outputs.path }}
          key: ${{ steps.go.outputs.key }}

  # An installation owns its whole cluster, so these tests run on a cluster of
  # their own, each clearing every key when it ends: on the suites job's they
  # would find its prefixes' keys foreign. A job of its own because cluster.sh
  # fixes the container name and port, so two clusters cannot share a host.
  install:
    name: FoundationDB installation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The suites job's paths, plus the commands that open the store, the
      # start check and node they drive, and the bootstrap loader.
      - name: Check for installation changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            install:
              - 'pkg/metadata/kv/**'
              - 'pkg/metadata/kvstore/**'
              - 'pkg/metadata/entity/**'
              - 'cmd/dfs/commands/**'
              - 'internal/node/**'
              - 'internal/install/**'
              - 'pkg/journal/**'
              - 'pkg/bootstrap/**'
              - 'test/fdb/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/actions/fdb-client/**'
              - '.github/actions/release-asset/**'
              - '.github/actions/go-cache/**'
              - '.github/workflows/foundationdb.yml'

      # The suites job saves the Go caches both jobs read.
      - name: Set up Go
        if: github.event_name != 'pull_request' || steps.filter.outputs.install == 'true'
        uses: ./.github/actions/go-cache
        with:
          go-version: "1.26.x"

      - name: Install the FoundationDB client
        if: github.event_name != 'pull_request' || steps.filter.outputs.install == 'true'
        uses: ./.github/actions/fdb-client

      - name: Start a one-process FoundationDB
        if: github.event_name != 'pull_request' || steps.filter.outputs.install == 'true'
        run: test/fdb/cluster.sh up 1

      # -p 1: each test owns the cluster while it runs, which
      # DITTOFS_FDB_OWN_CLUSTER lets the tests that clear it rely on.
      - name: Run the installation tests on FoundationDB
        if: github.event_name != 'pull_request' || steps.filter.outputs.install == 'true'
        run: >
          DITTOFS_FDB_CLUSTER_FILE="$HOME/.cache/dittofs-fdb/data/fdb.cluster"
          DITTOFS_FDB_OWN_CLUSTER=1
          go test -tags=foundationdb -race -p 1 -count=1 -timeout=20m
          -run '^(TestCheckKVFoundationDBNeedsNoBadgerPath|TestOpenKVPassesTheTLSFiles|TestOpenKVGivesUpOnAnUnreachableCluster|TestStartBeforeTheClusterAnswers|TestOpenKVOpensFoundationDB|TestStartClosesTheStoreOnFoundationDB|TestPreflightOnFoundationDB|TestInitStartStopOnFoundationDB|TestStartAndInitRefuseAForeignClusterOnFoundationDB)$'
          ./cmd/dfs/commands/ ./internal/node/

  # The release image's dfs init and dfs start on a cluster of its own, which
  # the installation owns: this proves the image's libfdb_c loads and speaks
  # to a 7.3 server. release.yml runs the same smoke before it pushes.
  image:
    name: FoundationDB image smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for image changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            image:
              - 'Dockerfile.foundationdb'
              - '.github/workflows/release.yml'
              - '.goreleaser.yml'
              - 'pkg/metadata/kv/fdbkv/**'
              - 'test/fdb/**'
              - '.github/workflows/foundationdb.yml'

      - name: Build the image
        if: github.event_name != 'pull_request' || steps.filter.outputs.image == 'true'
        run: docker build -f Dockerfile.foundationdb -t dittofs-foundationdb:smoke .

      - name: Start a one-process FoundationDB
        if: github.event_name != 'pull_request' || steps.filter.outputs.image == 'true'
        run: test/fdb/cluster.sh up 1

      - name: Run the image's init and start on FoundationDB
        if: github.event_name != 'pull_request' || steps.filter.outputs.image == 'true'
        run: test/fdb/cluster.sh smoke dittofs-foundationdb:smoke
