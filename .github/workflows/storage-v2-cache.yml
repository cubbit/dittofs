name: Storage-v2 build cache

# A run restores caches saved on its own branch or on the default branch only.
# A merge queue run's branch is a fresh gh-readonly-queue/feat/storage-v2/...
# one, so the race and coverage build cache that feat/storage-v2's pushes save
# is out of its reach, and every queue run builds the whole module from
# nothing. A workflow_run workflow always runs on the default branch, so the
# entry this one saves, under the very key the unit job looks up, is one every
# branch can restore.
#
# decision: only the unit job's race and coverage build is warmed: it is the
# longest job of a queue run. Go Checks and Integration still build cold in the
# queue. Drop this workflow when feat/storage-v2 becomes the default branch: its
# own pushes then save in the default branch's scope.

on:
  workflow_run:
    workflows: [Tests]
    # Requested, not completed: the warm-up runs beside the push run, so the
    # entry is ready about one push run sooner.
    types: [requested]
    branches: [feat/storage-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-v2-cache
  cancel-in-progress: true

jobs:
  race-cover:
    name: Warm the unit job's cache
    # A push run's head is a commit on feat/storage-v2 itself; a pull request
    # run's head is the contributor's branch, which this must never build.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout feat/storage-v2
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'feat/storage-v2' }}
          persist-credentials: false

      # The checked-out tree's own action, so the key is built exactly as the
      # unit job builds it.
      - name: Set up Go
        id: go
        uses: ./.github/actions/go-cache
        with:
          flavor: race-cover

      - name: Download modules
        if: steps.go.outputs.cache-hit != 'true'
        run: go mod download -x

      # The unit job's compiles: -race and coverage over the same packages,
      # then its non-race ones, the whole module's vet and the cells that run
      # without -race. No test runs: -run matches no name. The cells built
      # with extra tags stay cold.
      - name: Build the unit job's test binaries
        if: steps.go.outputs.cache-hit != 'true'
        run: |
          go build -o "$RUNNER_TEMP/dt" ./cmd/dt
          go test -race -count=1 -run='^$' -coverprofile="$RUNNER_TEMP/coverage.txt" ./pkg/... ./internal/... ./cmd/... ./test/...
          go vet ./...
          go test -count=1 -run='^$' ./pkg/journal/... ./internal/prof/ ./internal/adapter/... ./pkg/resources/

      - name: Save the Go caches
        if: steps.go.outputs.cache-hit != 'true' && steps.go.outputs.key != ''
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go.outputs.path }}
          key: ${{ steps.go.outputs.key }}
